appname = cms
httpport = 8125
runmode = dev

copyrequestbody = true
sessionon = true
# 设置session保存到文件中
sessionprovider = "file"
# session数据保存目录
sessionproviderconfig = "./logs/session"
# 站点名称
site.name = 内容管理

# cms数据库 - 支持 MySQL 和 PostgreSQL
# dialect 取值: mysql(默认) 或 postgres
cms.dialect = mysql
# ===== MySQL 配置示例 =====
cms.host = 127.0.0.1
cms.user = root
cms.password = 123456
cms.port = 3306
cms.db = cms
cms.prefix = cms_
cms.timezone = Asia/Shanghai
cms.migrate = true
# ===== PostgreSQL 配置示例(取消注释并注释掉MySQL配置) =====
# cms.dialect = postgres
# cms.host = 127.0.0.1
# cms.user = postgres
# cms.password = 123456
# cms.port = 5432
# cms.db = cms
# cms.prefix = cms_
# cms.timezone = Asia/Shanghai
# cms.sslmode = disable
# cms.migrate = true

# 认证数据库 - 支持 MySQL 和 PostgreSQL
auth.dialect = mysql
auth.host = 127.0.0.1
auth.user = root
auth.password = 123456
auth.port = 3306
auth.db = un2co_yunzhipin
auth.prefix = un2co_
auth.timezone = Asia/Shanghai

# 配置参数
LOCAL_DOMAIN = http://localhost:8125

# cas配置
cas.enabled = false
cas.url = http://localhost:10240