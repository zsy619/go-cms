appname = cms
httpport = 8125
runmode = dev

copyrequestbody = true
sessionon = true
# 设置session保存到文件中
sessionprovider = "file"
# session数据保存目录
sessionproviderconfig = "./logs/session"
# 站点名称
site.name = 内容管理

# ===================================================================
#                        CMS 数据库配置
# ===================================================================
# dialect 支持的数据库类型:
#   mysql     - MySQL / MariaDB
#   postgres  - PostgreSQL
#   sqlserver - Microsoft SQL Server
#   kingbase  - 人大金仓 KingbaseES (PG兼容, 默认端口54321)
#   gaussdb   - 高斯数据库 openGauss (PG兼容, 默认端口5432)
#   oracle    - Oracle (需安装驱动: go get github.com/cengsin/oracle)
#   dameng    - 达梦 DM8 (需安装驱动)
# ===================================================================

cms.dialect = mysql
# ===== MySQL 配置 =====
cms.host = 127.0.0.1
cms.user = root
cms.password = 123456
cms.port = 3306
cms.db = cms
cms.prefix = cms_
cms.timezone = Asia/Shanghai
cms.migrate = true

