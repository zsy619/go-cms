<!DOCTYPE html>
<html>

        var siteStatic = "{{.siteStatic}}";
        var channelName = "{{.channelName}}";
        var debug = "{{.debug}}";
    </script>
</head>

<body>
    {{TemplateTheme $.siteTheme "_nav.html" .}}
    {{TemplateTheme $.siteTheme "_banner.html" .}}
    <div class="main">
        <div class="w1200 clearfix contrast-us">
            <div class="nav-aside">
                <div class="top">联系我们</div>

                    <li></li>
                </ul>
            </div>
            <div class="cont-right">
                <div class="breadcrumb">
                    <img src="{{.siteStatic}}images/position.png" alt="" class="position" /> 您所在的位置：
                    <a href="/">首页</a>&nbsp;&gt;&nbsp;
                    <a href="javascript:void(0)" class="active">联系我们</a>
                </div>
                <div class="cont-detail">
                    <div class="left">
                        <div class="box">
                            <div class="tabTop">
                                <span class="title">办公室电话</span>
                            </div>
                            <div class="inner">
                                <p>咨询热线：0371-63388979 0371-63398979</p>
                            </div>
                        </div>
                        <div class="box">
                            <div class="tabTop">
                                <span class="title">校长邮箱</span>
                            </div>
                            <div class="inner">
                                <p>邮箱:62456899@qq.com</p>
                            </div>
                        </div>
                    </div>
                    <div class="right">
                        <div class="box">
                            <div class="tabTop">
                                <span class="title">地理位置</span>
                            </div>
                            <div class="inner">

                                    <div id="map"></div>

    </div>
    {{TemplateTheme $.siteTheme "_footer.html" .}}
    <script type="text/javascript" src="http://api.map.baidu.com/api?v=2.0&ak=Cy9sPCrjZ2AAGwMhN1nuoW04FD80hDzc"></script>
    <input type="hidden" name="" id="map_title" value='河南省工业学校（文南教学部）' />
    <input type="hidden" name="" id="map_info" value='电话：0371-63388979<br/>
        联系人：吴老师（17737115578）<br/>
        邮箱：625178356@qq.com<br/>
        网址：www.hngyxxnxq.com' />
    <script type="text/javascript">
        var address = [112.976318, 34.70917];


        // 创建地图实例
        var map = new BMap.Map("map");
        // 创建点坐标 
        var point = new BMap.Point(address[0], address[1]);
        // 初始化地图，设置中心点坐标和地图级别
        map.centerAndZoom(point, 15);

        addMapControl()

        //向地图添加控件
        function addMapControl() {
            var scaleControl = new BMap.ScaleControl({
                anchor: BMAP_ANCHOR_BOTTOM_LEFT
            });
            scaleControl.setUnit(BMAP_UNIT_IMPERIAL);
            map.addControl(scaleControl);
            var navControl = new BMap.NavigationControl({
                anchor: BMAP_ANCHOR_TOP_LEFT,
                type: BMAP_NAVIGATION_CONTROL_LARGE
            });
            map.addControl(navControl);
            var overviewControl = new BMap.OverviewMapControl({
                anchor: BMAP_ANCHOR_BOTTOM_RIGHT,
                isOpen: true
            });
            map.addControl(overviewControl);
        }

        var mapTitle = document.getElementById('map_title').value;
        var mapInfo = document.getElementById('map_info').value;
        addMapOverlay()
        function addMapOverlay() {
            var markers = [{
                title: mapTitle,
                content: mapInfo,
                imageOffset: {
                    width: -46,
                    height: -21
                },
                position: {
                    lng: address[0],
                    lat: address[1]
                }
            }]
            for (var i = 0; i < markers.length; i++) {
                var point = new BMap.Point(markers[i].position.lng, markers[i].position.lat);
                var marker = new BMap.Marker(point, {
                    icon: new BMap.Icon('{{.siteStatic}}images/map_icon.png', new BMap.Size(20, 25), {
                        imageOffset: new BMap.Size(markers[i].imageOffset.width, markers[i].imageOffset.height)
                    })
                })
                var label = new BMap.Label(markers[i].title, {
                    offset: new BMap.Size(25, 5)
                })
                var opts = {
                    width: 320,
                    title: markers[i].title,
                    enableMessage: false
                };
                var infoWindow = new BMap.InfoWindow(markers[i].content, opts);
                // marker.setLabel(label); //地图标题
                addClickHandler(marker, infoWindow);
                map.addOverlay(marker);
                marker.setAnimation(BMAP_ANIMATION_BOUNCE); //跳动icon
                marker.openInfoWindow(infoWindow);
            }
        }
        setMapEvent()
        function setMapEvent() {
            map.enableScrollWheelZoom();
            map.enableKeyboard();
            map.enableDragging();
            map.enableDoubleClickZoom()
        }
        function addClickHandler(target, window) {
            target.addEventListener("click", function () {
                target.openInfoWindow(window);
            });
        }
    </script>
</body>

</html>
