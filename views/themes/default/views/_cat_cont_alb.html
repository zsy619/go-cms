<div class="cont-right">
    {{TemplateTheme $.siteTheme "_cat_nav_top.html" .}}
    <div class="cont-detail">
        <div class="box">
            <div class="tabTop">
                <span class="title artilce_title"></span>
            </div>
            <div class="detail-box">
            </div>
        </div>
        <div class="box list-con">
            <div class="tabTop">
                <span class="title">工作风采</span>
            </div>
            <ul class="imglist-ul" id="lunbo">
            </ul>
        </div>
    </div>
</div>
<script type="text/template" id="tmplAlbum">
    <li>
        <a>
            <div class="img-box">
                <img data-original="${originalPath}" src="${originalPath}" class="img" />
            </div>
            <p class="title">${title}</p>
        </a>
    </li>
</script>
<script type="text/javascript">
    var loadData = function () {
        $.ajax({
            url: "/api/article/find?call_index=" + categoryName + "&r=" + Math.random(),
            dataType: "json",
            type: "get",
            beforeSend: function () {
                $(".detail-box").html("");
                $(".cont-detail").busyLoad("show", { spinner: "circle-line" });
            },
            success: function (res) {
                if (res.code == CodeSuccess) {
                    $(".detail-box").html(res.data.article.content);
                    $(".artilce_title").html(res.data.article.title);

                    var tmpl = $("#tmplAlbum").html();
                    var len = res.data.album.length;
                    for (var i = 0; i < len; i++) {
                        var item = res.data.album[i];
                        var html = tmpl.replaceAll("${originalPath}", item.original_path).replaceAll("${title}", item.title);
                        $("#lunbo").append(html);
                    }

                    var viewer = new Viewer(document.getElementById('lunbo'), {
                        url: 'data-original'
                    });
                }
            },
            error: function () {
                alert('failed!');
            },
            complete: function () {
                $(".cont-detail").busyLoad("hide", { animate: "fade" });
            }
        });
    };

    layui.use(['form', 'element', 'laypage', 'layer'], function () {
        var form = layui.form,
            element = layui.element,
            laypage = layui.laypage,
            layer = layui.layer;

        loadData();
        ArticleClick(0, categoryName);

        form.render(); //刷新所有渲染效果，也可以单独熟悉某个效果	
        form.render('select'); //刷新select选择框渲染
    })
</script>
