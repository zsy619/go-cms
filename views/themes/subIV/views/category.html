<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>{{if eq .site.HomeTitle ""}}{{.site.Title}}{{else}}{{.site.HomeTitle}}{{end}}</title>

    <script src="/views/themes/subIV/static/js/common/commonCss.js"></script>
</head>
<body>
{{TemplateTheme $.siteTheme "_nav.html" .}}
<div class="body theme2">
    <div class="container show-margin" style="position: relative;">
        <div class="listCon clearfix">
            <div class="right" style="width: 100%;">
                {{TemplateTheme $.siteTheme "_nav_top_path.html" .}}
                <div class="subcon" style="background-color: #fff;">
                    <div class="list">
                        <ul id="articleList">
                            <li>
                                <div class="news">
                                    <div class="fl">
                                        <div class="top">19</div>
                                        <div class="bottom">2023-12</div>
                                    </div>
                                    <div class="fr">
                                        <a href="导航详情页.html">
                                            <div class="tit">
                                                国务院办公厅关于进一步支持大学生创新创业的指导意见
                                            </div>
                                            <div class="sub">
                                                国务院办公厅关于进一步支持大学生创新创业的指导意见国办发〔2021〕35号
                                            </div>
                                        </a>
                                    </div>
                                </div>
                            </li>
                        </ul>

                    </div>
                    <div id="pagination" class="pagination"></div>
                </div>
                <!--<div class="subcon">
                    <div class="list">
                        <ul id="articleList">
                        </ul>
                    </div>
                    <div id="pagination" class="pagination"></div>
                </div>-->
            </div>
        </div>


    </div>
</div>
<!-- footer -->
{{TemplateTheme $.siteTheme "_footer.html" .}}
<script type="text/javascript">
    var siteStatic = "{{.siteStatic}}";
    var channelName = "{{.channelName}}";
    var categoryName = "{{.categoryName}}";
    var siteFlag = "{{.channel.SiteFlag}}";
    var debug = "{{.debug}}";

    layui.use(['form', 'element', 'laypage', 'layer'], function () {
        var laypage = layui.laypage,
            layer = layui.layer;

        GetArticleList(1, 10)

        // 获取文章列表
        function GetArticleList(page, limit){
            var art = new Article();
            art.paginate({
                limit: limit,
                page: page,
                call_index: categoryName,
            }, function (){

            }, function (res){
                if (res.code == CodeSuccess) {
                    var len = res.data.length;
                    if(len > 0){
                        for (var i = 0; i < len; i++) {
                            var item = res.data[i];
                            var url = UrlForArticle(item.category_call_index, item.article_id, item.link_url);
                            var time = moment(item.publish_time);
                            console.log(moment(item.publish_time).get('date'))
                            var html = '<li>\n' +
                                '                                <div class="news">\n' +
                                '                                    <div class="fl">\n' +
                                '                                        <div class="top">' + time.get('date') + '</div>\n' +
                                '                                        <div class="bottom">' + time.get('year')+'-'+ (time.get('month')+1) + '</div>\n' +
                                '                                    </div>\n' +
                                '                                    <div class="fr">\n' +
                                '                                        <a href='+ url +'>\n' +
                                '                                            <div class="tit">\n' +
                                '                                                '+item.title+'\n' +
                                '                                            </div>\n' +
                                '                                            <div class="sub">\n' +
                                '                                                '+item.sub_title+'\n' +
                                '                                            </div>\n' +
                                '                                        </a>\n' +
                                '                                    </div>\n' +
                                '                                </div>\n' +
                                '                            </li>';
                            $("#articleList").append(html);
                        }
                    }
                    $(".total").html("共" + res.count + "条");
                    if (res.count == 0) {
                        $(".list-ul").html($("#templateEmpty").html());
                    }
                    if (page === 1 && len > 0) {
                        laypage.render({
                            elem: 'pagination'
                            , limit: 10
                            , prev: '上页'
                            , next: '下页'
                            , limits: [10, 20, 30, 40, 50, 100]
                            , count: res.count //数据总数，从服务端得到
                            , jump: function (obj, first) {
                                if (!first) {
                                    GetArticleList(obj.curr, obj.limit);
                                }
                            }
                        });
                    }
                }
            }, function (){

            });
        }
    })
</script>
</body>

</html>
