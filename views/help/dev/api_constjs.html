
        <article class="content ">
            <h1 class="title has-text-centered">const.js文件</h1>
            <hr>
            <p></p>
            <p>1. 页面引用const.js文件。&nbsp;</p>
            <textarea id="config" code-type="javascript">
<script src="/static/const.min.js"></script>
</textarea>
            <p>对常用js操作进行封装。</p>
            <p>2. 请求代码</p>
            <textarea id="config1" code-type="javascript">
var CodeSuccess = 0; // 成功
var CodeError = 1;// 失败
var CodeInvalid = 2;// 无效
var CodeNoAuth = 3;// 无权限
var CodeParamError = 4;// 参数错误
var CodeNoLogin = 5;// 未登录
var CodeNoData = 6;// 无数据
var CodeFatal = 7;// 严重错误
</textarea>
            <p>3. ArticleClick函数</p>
            <p>文章点击率</p>
            <textarea id="config2" code-type="javascript">
{int64} articleId 文章ID
{string} callIndex 文件调用别名,如果为空则不记录
</textarea>
            <p>4. AdsClick函数</p>
            <p>广告点击率</p>
            <textarea id="configAds" code-type="javascript">
{int64} ads_id 广告ID
</textarea>
            <p>5. LinkClick函数</p>
            <p>链接点击率</p>
            <textarea id="configLink" code-type="javascript">
{int64} link_id 链接ID
</textarea>
            <p>6. UrlForArticle函数</p>
            <p>文章链接</p>
            <p>
                <textarea id="config3" code-type="javascript">
{string} call_index 栏目别名
{int64} article_id 文章ID
{string} url 自定义链接
</textarea>
            <p>7. UrlForSearch函数</p>
            <p>搜索链接</p>
            <textarea id="config4" code-type="javascript">
{string} keyword 关键词
</textarea>
            <p>8. UrlForTopic函数</p>
            <p>专题链接</p>
            <textarea id="config5" code-type="javascript">
{string} site_flag 站点标识
{string} name 专题名称
</textarea>
            <p>9. UrlForTag函数</p>
            <p>标签链接</p>
            <textarea id="config6" code-type="javascript">
{string} site_flag 站点标识
{string} name 标签名称
</textarea>
            <p>怎么样，是不是很实用呢。</p>
