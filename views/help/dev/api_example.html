            <p>2. 获取文章示例</p>
            <p>
                <textarea id="config1" code-type="javascript">
var ariticle = new Article(); //创建文章对象
ariticle.get({ //获取文章列表
    call_index: "xyxw",
    limit: 6,
    is_slide: 1
}, function () {
    $("#divTpxw").html("");
    $("#divTpxw").busyLoad("show", { spinner: "circle-line" }); //显示加载动画
}, function (res) {
    $("#divTpxw").busyLoad("hide", { animate: "fade" }); //隐藏加载动画
    if (res.code == CodeSuccess) { //成功
        var len = res.data.length; //获取数据长度
        for (var i = 0; i < len; i++) {
            var item = res.data[i]; //获取数据项
            var url = UrlForArticle(item.category_call_index, item.article_id, item.link_url); //获取文章链接
            var html = '<div class="carousel-item"><img src="' + item.img_url1 + '" /><div class="carousel-opc"></div><a target="_blank" href="' + url + '"><span class="title">' + item.title + '</span></a></div>';
            $("#divTpxw").append(html);
        }
        if (len > 0) { //大于0个才初始化
            $('.single-item2').slick({
                infinite: true, //循环功能
                slidesToShow: 1, //可见数
                slidesToScroll: 1, //滚动个数
                autoplay: true, //自动播放
                arrows: true, //左右箭头
                draggable: true, //拖拽功能
                dots: true, //指示点
                fade: false,// 开启渐隐切换模式
                autoplaySpeed: 5000, //自动播放速度
                speed: 1000, //切换动画速度
            });
        }
    }
}, function () {
    $("#divTpxw").busyLoad("hide", { spinner: "circle-line" }); //隐藏加载动画
});
</textarea>
            </p>
            <p><br></p>
