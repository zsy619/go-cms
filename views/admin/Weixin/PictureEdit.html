<style>
    .layui-form-label {
        width: 120px;
    }
</style>
<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
        <div class="layui-tab layui-tab-brief layui-tab-card">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            公众账户
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="hidden" name="request_type" value="{{.request_type}}">
                            <input type="hidden" name="rule_id" value="{{.mdl.RuleID}}">
                            <input type="hidden" name="name" value="{{.mdl.Name}}">
                            <select name="account_id" lay-filter="account_id" lay-verify="required" lay-reqtext="微信公账号必选项">
                                <option value="">请选择公众账户</option>
                                {{range $index,$item := .accountList}}
                                <option value="{{$item.AccountID}}" {{if eq $.mdl.AccountID $item.AccountID}}selected="selected" {{end}}>{{$item.Name}}</option>
                                {{end}}
                            </select>
                        </div>
                        <div class="layui-form-mid layui-word-aux">当前公众账号，可切换！</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            搜索关键词
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="keywords" value="{{.mdl.Keywords}}" maxlength="256" lay-verify="required" lay-reqtext="搜索关键词为必填项" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">多个关键词请用|格开：例如: 美丽|漂亮|好看</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            关键词类型
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="is_like_query" value="0" title="完全匹配" {{if eq .mdl.IsLikeQuery 0}}checked="checked" {{end}}>
                            <input type="radio" name="is_like_query" value="1" title="包含匹配" {{if eq .mdl.IsLikeQuery 1}}checked="checked" {{end}}>
                        </div>
                        <div class="layui-form-mid layui-word-aux">包含匹配，当文字包含本关键词时触发</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">排序数字</label>
                        <div class="layui-input-inline" style="width: 80px;">
                            <input type="number" id="sort_id" name="sort_id" lay-verify="number" value="{{.mdl.SortID}}" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">排序数字为0-999的正整数，越小越靠前</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            图文列表
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <button type="button" id="btnSelect" class="layui-btn layui-btn-sm layui-btn-primary"><i class="layui-icon layui-icon-addition"></i> 添加</button>
                        </div>
                        <div class="layui-form-mid layui-word-aux">微信规定图片数量最多10张。</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            &nbsp;
                        </label>
                        <div class="layui-input-inline" style="width: 600px;">
                            <table class="layui-hide" id="tableContainer" lay-filter="currentTableFilter"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;">
                <button type="button" class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
            </div>
        </div>
    </form>
    <script type="text/html" id="currentTableBar">
        <div class="layui-btn-group">
            <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete layui-btn-radius" lay-event="delete">删除</a>
        </div>
    </script>
</div>
<div style="display: none" id="divSelect">
    <form class="layui-form" method="get" lay-filter="frmSelect" id="frmSelect">
        <div class="layui-form-item">
            <p>&nbsp;</p>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="width: 60px;margin-left: -10px;">
                排序数字
            </label>
            <div class="layui-input-inline" style="width: 590px;">
                <input type="number" value="99" name="sort_id" autocomplete="off" placeholder="" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="width: 60px;margin-left: -10px;">
                标题文字
            </label>
            <div class="layui-input-inline" style="width: 590px;">
                <input type="text" name="title" lay-verify="required" lay-reqtext="标题文字不允许为空" autocomplete="off" placeholder="" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="width: 60px;margin-left: -10px;">
                上传图片
            </label>
            <div class="layui-input-inline" style="width: 480px;">
                <input type="text" name="img_url" lay-verify="required" lay-reqtext="上传一个图片文件" autocomplete="off" placeholder="" class="layui-input">
            </div>
            <button type="button" class="layui-btn layui-btn-primary" id="btnImg">
                <i class="layui-icon">&#xe67c;</i>浏览...
            </button>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="width: 60px;margin-left: -10px;">
                链接地址
            </label>
            <div class="layui-input-inline" style="width: 590px;">
                <input type="text" name="link_url" autocomplete="off" placeholder="" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="width: 60px;margin-left: -10px;">
                图片描述
            </label>
            <div class="layui-input-inline" style="width: 590px;">
                <textarea name="content" placeholder="" class="layui-textarea"></textarea>
            </div>
        </div>
        <button id="btnSelSubmit" style="display: none;">提交</button>
        <button id="btnSelReset" type="reset" style="display: none;">重置</button>
    </form>
</div>
<script>
    var ImageReply = {
        code: 0,
        msg: "",
        count: 0,
        data: []
    };
    layui.use(['form', 'layer', 'upload', 'laydate', 'table'], function () {
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer;
        var upload = layui.upload;
        var table = layui.table;

        //执行实例
        var uploadInstx = upload.render({
            elem: '#btnImg' //绑定元素
            , url: '/admin/tools/ImageUpload?path=weixin' //上传接口
            , done: function (res) {
                //上传完毕回调
                if (res.code == 0) {
                    $("input[name='img_url']").val(res.file.url1);
                } else {
                    layer.msg(res.msg);
                }
            }
            , error: function () {
                //请求异常回调
            }
        });

        form.on('select(account_id)', function (data) {
            loadContent();
        });

        var tableIns = table.render({
            elem: '#tableContainer',
            height: "229",
            data: ImageReply.data,
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                {
                    field: 'img_url', width: 110, title: '图片', templet: function (d) {
                        var outStr = "<input type='hidden' name='img_url' value='" + d.img_url + "' />";
                        if (d.img_url != "") {
                            outStr += '<img src="' + d.img_url + '" style="max-width: 100px;max-height: 100px;" />';
                        }
                        return outStr;
                    }
                },
                {
                    field: 'title', title: '标题', templet: function (d) {
                        return '<input type="text" name="title" value="' + d.title + '" class="layui-input" style="" />';
                    }
                },
                {
                    field: 'link_url', title: '链接', templet: function (d) {
                        return '<input type="text" name="link_url" value="' + d.link_url + '" class="layui-input" style="" />';
                    }
                },
                {
                    field: 'content', title: '描述', templet: function (d) {
                        return '<input type="text" name="content" value="' + d.content + '" class="layui-input" style="" />';
                    }
                },
                {
                    field: 'sort_id', width: 100, align: "center", title: '排序', templet: function (d) {
                        return '<input type="number" name="sort_id" value="' + d.sort_id + '" class="layui-input" style="" />';
                    }
                },
                { title: '操作', width: 80, toolbar: '#currentTableBar', align: "center", fixed: "right" }
            ]],
            limits: [10, 15, 20, 25, 50, 100],
            limit: 20,
            page: false,
            even: true,
            size: 'lg',
            done: function () {
                $(".layui-table-main tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-body tbody tr")[index]).height($(val).height());
                    });
                });
                $(".layui-table-header tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-header thead tr")[index]).height($(val).height());
                    });
                });
            }
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'delete') {
                layer.confirm('真的删除行么', function (index) {
                    layer.closeAll();
                    var cacheData = table.cache['tableContainer'];
                    obj.del();
                    var rowIndex = obj.tr.attr("data-index"); //获取行索引
                    cacheData.splice(rowIndex, 1);  //彻底移除元素
                    initTableData();
                });
            }
        });

        function initTableData() {
            ImageReply.count = 0;
            ImageReply.data = [];
            $("table[class=layui-table]").children("tbody").children("tr").each(function () {
                if ($(this).find("input[name='title']").val() != undefined) {
                    var item = {};
                    item.img_url = $(this).find("input[name='img_url']").val();
                    item.title = $(this).find("input[name='title']").val();
                    item.link_url = $(this).find("input[name='link_url']").val();
                    item.content = $(this).find("input[name='content']").val();
                    item.sort_id = parseInt($(this).find("input[name='sort_id']").val());
                    ImageReply.data.unshift(item);
                }
            });
        }

        //自定义验证规则
        form.verify({
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            return false;
        });

        function loadContent() {
            var rule_id = parseInt($("input[name='rule_id']").val());
            if (rule_id == 0) {
                return;
            }
            var url = "/admin/weixin/RulePictureFind?rule_id=" + rule_id + "&r=" + Math.random();
            $.ajax({
                type: "GET", //提交的方法
                url: url, //提交的地址
                async: false,
                beforeSend: function () { //当一个Ajax请求开始时触发
                    this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                },
                error: function (request) {  //失败的话
                },
                success: function (response) {  //成功
                    if (response.code == CodeSuccess) {
                        // 初始化数据
                        ImageReply.data = response.data;
                        ImageReply.count = response.data.length;
                        tableReload();
                    } else {
                        layer.msg(response.msg, { icon: 2, time: 1000 });
                    }
                },
                complete: function () {
                    layer.close(this.layerIndex);
                },
            });
        }

        function tableReload() {
            table.reload("tableContainer", {
                data: ImageReply.data
            });
            table.render();
            form.render();
        }

        loadContent();

        $("#btnSelect").on('click', function () {
            $("#btnSelReset").click();
            layer.open({
                type: 1,
                title: '添加图片',
                area: ['600', '620'],
                content: $('#divSelect'), //可以使用$('#id,.class')这种方式来指定模板，可以将其理解为指定一个组件，当然也是可以自己去写的,像'<div>我是一个内容</div>'
                btn: ['确认', '取消'],
                yes: function (index, layero) {
                    $('#btnSelSubmit').click()
                },
                btn2: function (index, layero) {
                    layer.close(index);
                },
                success: function () {
                },
            })
        })

        $("#btnSelSubmit").on('click', function () {
            form.submit('frmSelect', function (data) {
                layer.closeAll();
                ImageReply.data.unshift({
                    "sort_id": parseInt($("#frmSelect").find("input[name=sort_id]").val()),
                    "title": $("#frmSelect").find("input[name=title]").val(),
                    "img_url": $("#frmSelect").find("input[name=img_url]").val(),
                    "link_url": $("#frmSelect").find("input[name=link_url]").val(),
                    "content": $("#frmSelect").find("textarea[name=content]").val(),
                });
                ImageReply.count++;
                tableReload();
            });
            return false;
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            if ($("select[name=account_id]").val() == undefined || $("select[name=account_id]").val() == "") {
                layer.msg("请选择公众号", { icon: 2, time: 1000 });
                return;
            }
            var hasEmpty = false;
            var image_reply = [];
            $("table[class=layui-table]").children("tbody").children("tr").each(function () {
                if ($(this).find("input[name='title']").val() != undefined) {
                    var item = {};
                    item.content_id = 0;
                    item.rule_id = parseInt($("input[name=image_rule_id]").val());
                    item.img_url = $(this).find("input[name='img_url']").val();
                    item.title = $(this).find("input[name='title']").val();
                    item.link_url = $(this).find("input[name='link_url']").val();
                    item.content = $(this).find("input[name='content']").val();
                    item.sort_id = parseInt($(this).find("input[name='sort_id']").val());
                    if (item.title == "") {
                        hasEmpty = true;
                        return false;
                    }
                    image_reply.unshift(item);
                }
            })
            if (hasEmpty) {
                layer.msg("图文回复标题不能为空", { icon: 2, time: 1000 });
                return false;
            }
            if (image_reply.length == 0) {
                layer.msg("图文回复不能为空", { icon: 2, time: 1000 });
                return false;
            }
            var reqBody = {
                account_id: parseInt($("select[name=account_id]").val()),
                request_type: parseInt($("input[name=request_type]").val()),
                rule_id: parseInt($("input[name=rule_id]").val()),
                name: $("input[name=name]").val(),
                keywords: $("input[name=keywords]").val(),
                is_like_query: parseInt($("input[name=is_like_query]").val()),
                sort_id: parseInt($("input[name=sort_id]").val()),
                image_reply: image_reply,
            };
            form.submit('frmEdit', function (data) {
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/weixin/PictureSave", //提交的地址
                    data: JSON.stringify(reqBody),
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.$('button[lay-filter="data-search-btn"]').click();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
