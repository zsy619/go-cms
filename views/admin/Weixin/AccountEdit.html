<style>
    .layui-form-label {
        width: 120px;
    }
</style>
<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
        <div class="layui-tab layui-tab-brief layui-tab-card">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 公众号名称
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="hidden" name="account_id" value="{{.mdl.AccountID}}">
                            <input type="text" name="name" value="{{.mdl.Name}}" maxlength="64" lay-verify="required" lay-reqtext="公众号名称为必填项" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">公众平台账号名称，最多64个字符，且唯一</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 公众号原始ID
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="original_id" value="{{.mdl.OriginalID}}" maxlength="512" lay-verify="required" lay-reqtext="公众号原始ID为必填项" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">公众平台账号原始ID</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 公众平台微信号
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="wx_code" value="{{.mdl.WxCode}}" maxlength="64" lay-verify="required" lay-reqtext="公众平台微信号为必填项" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">公众平台微信号，最多64个字符，且唯一</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 令牌（Token）
                        </label>
                        <div class="layui-input-inline" style="width: 377px;">
                            <input type="text" name="token" value="{{.mdl.Token}}" autocomplete="off" lay-verify="required" lay-reqtext="令牌（Token）为必填项" placeholder="" class="layui-input">
                        </div>
                        <button type="button" class="layui-btn layui-btn-primary" onclick="rand()">
                            <i class="layui-icon">&#xe6b1;</i>随机生成
                        </button>
                        <br>
                        <div class="layui-form-mid layui-word-aux" style="margin-left:150px;">复制此Token到微信公众号后台开发者中心</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 消息加解密密钥
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="app_aes_key" value="{{.mdl.AppAesKey}}" autocomplete="off" lay-verify="required" lay-reqtext="消息加解密密钥为必填项" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">在开发模式中点随机生成，然后复制到这边</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            开发者ID(AppID)
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="app_id" value="{{.mdl.AppID}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">可由微信公众号后台获取，然后复制到这边</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            开发者密码(AppSecret)
                        </label>
                        <div class="layui-input-inline" style="width: 377px;">
                            <input type="text" id="app_secret" name="app_secret" value="{{.mdl.AppSecret}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <button type="button" id="wechat-appsecret-text" class="layui-btn layui-btn-primary" onclick="show()">
                            <i class="layui-icon">&#xe673;</i>显示密码
                        </button>
                        <br>
                        <div class="layui-form-mid layui-word-aux">由微信后台生成，然后复制到这边</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            内容推送
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="is_push" value="true" title="推送" {{if eq .mdl.IsPush true}}checked="checked" {{end}}>
                            <input type="radio" name="is_push" value="false" title="禁用" {{if eq .mdl.IsPush false}}checked="checked" {{end}}>
                        </div>
                        <div class="layui-form-mid layui-word-aux">网站内容推送至微信(备用)</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">排序号</label>
                        <div class="layui-input-inline" style="width: 80px;">
                            <input type="number" name="sort_id" lay-verify="number" value="{{.mdl.SortID}}" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">数字，越小越向前</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">状&nbsp;&nbsp;态</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="status" value="0" title="草稿" {{if eq .mdl.Status 0}}checked="checked" {{end}}>
                            <input type="radio" name="status" value="2" title="通过" {{if eq .mdl.Status 2}}checked="checked" {{end}}>
                            <input type="radio" name="status" value="3" title="拒绝" {{if eq .mdl.Status 3}}checked="checked" {{end}}>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;">
                <!-- <button class="layui-btn" id="btnSubmit">立即提交</button> -->
                <button class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
            </div>
        </div>
    </form>
</div>
<script>
    function rand() {
        var str = Math.random().toString(36).substr(2);
        $("input[name='token']").val(str);
    }

    function show() {
        var wx_secret = document.getElementById("app_secret");
        if (wx_secret.type == "password") {
            wx_secret.type = "text";
            $("#wechat-appsecret-text").html('<i class="layui-icon">&#xe673;</i>隐藏密码');
        } else {
            wx_secret.type = "password";
            $("#wechat-appsecret-text").html('<i class="layui-icon">&#xe673;</i>显示密码');
        }
    }

    layui.use(['form', 'layer', 'wangEditor', 'upload', 'laydate', 'treeSelect'], function () {
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer,
            wangEditor = layui.wangEditor;
        var upload = layui.upload;
        var laydate = layui.laydate;
        var treeSelect = layui.treeSelect;

        //自定义验证规则
        form.verify({
            // title: function (value) {
            //     if (value.length < 5) {
            //         return '标题也太短了吧';
            //     }
            // }
            // , pass: [/(.+){6,12}$/, '密码必须6到12位']
            // , money: [
            //     /^\d+\.\b\d{2}\b$/
            //     , '金额必须为小数保留两位'
            // ]
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            console.log(data)
            // alert(JSON.stringify(data.field));
            return false;
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            form.submit('frmEdit', function (data) {
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/weixin/AccountSave", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        console.log(data);
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
