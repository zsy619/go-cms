<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>后台管理-登陆</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta http-equiv="Access-Control-Allow-Origin" content="*">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="format-detection" content="telephone=no">
	<link href="/static/favicon.ico" rel="icon">
	<link rel="stylesheet" href="/static/admin/lib/layui-v2.9.21/css/layui.css" media="all">
	<!--[if lt IE 9]>
    <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
    <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
	<style>
		html, body {
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		body {
			background: transparent;
			position: relative;
			font-size: 12px;
		}

		#dynamic-bg {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			pointer-events: none;
			background: linear-gradient(-45deg, #0a2a5e, #148be4, #1e9fff, #00a0e9, #007acc, #0a2a5e);
			background-size: 400% 400%;
			animation: gradientBG 18s ease infinite;
			overflow: hidden;
		}

		@keyframes gradientBG {
			0% { background-position: 0% 50%; }
			50% { background-position: 100% 50%; }
			100% { background-position: 0% 50%; }
		}

		/* 鼠标光晕 */
		#dynamic-bg::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%),
				rgba(255, 255, 255, 0.18) 0%,
				rgba(120, 200, 255, 0.10) 18%,
				rgba(30, 159, 255, 0.04) 36%,
				transparent 60%);
			transition: background 0.4s ease-out;
		}

		/* 漂浮气泡装饰 */
		#dynamic-bg::after {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-image:
				radial-gradient(circle at 15% 25%, rgba(255,255,255,0.08) 0, transparent 8%),
				radial-gradient(circle at 85% 15%, rgba(255,255,255,0.06) 0, transparent 10%),
				radial-gradient(circle at 75% 80%, rgba(255,255,255,0.07) 0, transparent 9%),
				radial-gradient(circle at 25% 75%, rgba(255,255,255,0.05) 0, transparent 7%),
				radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04) 0, transparent 12%);
			animation: floatBubbles 20s ease-in-out infinite;
		}

		@keyframes floatBubbles {
			0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
			25%      { transform: translate(20px, -15px) scale(1.05); opacity: 1; }
			50%      { transform: translate(-15px, 20px) scale(0.95); opacity: 0.8; }
			75%      { transform: translate(10px, 10px) scale(1.03); opacity: 0.95; }
		}

		.bg-particle-canvas {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			pointer-events: none;
		}

		.main-body {
			position: fixed;
			z-index: 1;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			pointer-events: none;
		}

		.main-body .login-main {
			float: none;
			pointer-events: auto;
		}

		/* === 网易邮箱风格下划线式输入框 (企业级) === */

		/* 输入项容器 —— 使用 Grid 三栏布局,根治错位 */
		.login-main .login-bottom .center .item {
			position: relative;
			width: 288px;
			height: 50px;
			margin-bottom: 24px;
			display: grid;
			grid-template-columns: 36px 1fr auto;
			column-gap: 10px;
			align-items: center;
			padding: 0;
			background: transparent;
		}

		/* 验证码 item 宽度覆盖 —— img 右端与上方 item 对齐 (右偏移 68px) */
		.login-main .login-bottom .center .item.is-compound {
			width: 220px;
			grid-template-columns: 36px 1fr 80px;
		}
		/* 让验证码图视觉右端与上方输入框右端对齐 (上 item 288 - 验证码 item 220 = 68px) */
		.login-main .login-bottom .center .item.is-compound .actions {
			justify-self: end;
			margin-right: -68px;
		}

		/* === 左侧 SVG 图标 === */
		.login-main .login-bottom .center .item .icon {
			grid-column: 1;
			width: 36px;
			height: 36px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #9aa3af;
			transition: color 0.25s ease, transform 0.25s ease;
		}
		.login-main .login-bottom .center .item .icon svg {
			width: 18px;
			height: 18px;
			display: block;
		}
		.login-main .login-bottom .center .item:focus-within .icon {
			color: #148be4;
			transform: translateY(-1px);
		}
		.login-main .login-bottom .center .item.is-error .icon {
			color: #ff4d4f;
		}

		/* === 输入框:固定在第 2 列,占满中间 === */
		.login-main .login-bottom .center .item input {
			grid-column: 2;
			width: 100%;
			min-width: 0;
			height: 36px;
			padding: 0;
			border: 0;
			outline: 0;
			background: transparent;
			font-size: 16px;
			color: #1f2937;
			letter-spacing: 0.2px;
			-webkit-appearance: none;
			appearance: none;
			border-radius: 0;
			align-self: center;
		}

		/* === 右侧操作容器:固定在第 3 列 === */
		.login-main .login-bottom .center .item .actions {
			grid-column: 3;
			display: inline-flex;
			align-items: center;
			justify-content: flex-end;
			gap: 4px;
			height: 32px;
		}

		/* 验证码图片 */
		.login-main .login-bottom .center .item .validateImg {
			height: 32px;
			width: 80px;
			border: 1px solid #e6e6e6;
			border-radius: 4px;
			cursor: pointer;
			display: block;
		}

		/* 下划线:默认 1px 浅灰,聚焦时 2px 蓝色渐变 */
		.login-main .login-bottom .center .item::after {
			content: '';
			position: absolute;
			left: 0;
			right: 0;
			bottom: 4px;
			height: 1px;
			background: #d8dde3;
			transition: background 0.25s ease, height 0.25s ease;
			pointer-events: none;
		}

		.login-main .login-bottom .center .item:focus-within::after {
			height: 2px;
			background: linear-gradient(90deg, #148be4, #1E9FFF);
		}

		/* 错误状态:下划线变红 */
		.login-main .login-bottom .center .item.is-error::after {
			height: 2px;
			background: #ff4d4f;
		}

		/* 错误抖动动画 */
		@keyframes shake-x {
			0%, 100% { transform: translateX(0); }
			10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
			20%, 40%, 60%, 80% { transform: translateX(4px); }
		}
		.login-main .login-bottom .center .item.is-error {
			animation: shake-x 0.4s ease;
		}

		/* 错误提示文字 */
		.login-main .login-bottom .center .item .item-tip {
			position: absolute;
			top: 100%;
			left: 0;
			margin-top: 2px;
			font-size: 12px;
			line-height: 18px;
			color: #ff4d4f;
			opacity: 0;
			transform: translateY(-4px);
			transition: opacity 0.25s ease, transform 0.25s ease;
			pointer-events: none;
			white-space: nowrap;
		}
		.login-main .login-bottom .center .item.is-error .item-tip {
			opacity: 1;
			transform: translateY(0);
		}

		/* 旧 flex 布局的 .icon / input 规则已并入上方 Grid 块,此处仅保留 autofill 兼容 */
		/* 去掉浏览器 autofill 黄底 */
		.login-main .login-bottom .center .item input:-webkit-autofill,
		.login-main .login-bottom .center .item input:-webkit-autofill:hover,
		.login-main .login-bottom .center .item input:-webkit-autofill:focus {
			-webkit-text-fill-color: #1f2937;
			-webkit-box-shadow: 0 0 0 1000px #ffffff inset;
			transition: background-color 5000s ease-in-out 0s;
		}

		/* placeholder */
		.login-main .login-bottom .center .item input::placeholder {
			color: #b3b7bf;
			transition: opacity 0.25s ease;
		}
		.login-main .login-bottom .center .item:focus-within input::placeholder {
			opacity: 0.7;
		}

		/* 右侧操作按钮(眼睛/清除) */
		.login-main .login-bottom .center .item .action-btn {
			width: 28px;
			height: 28px;
			border: 0;
			background: transparent;
			color: #9aa3af;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			opacity: 0;
			transform: scale(0.7);
			pointer-events: none;
			transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease, background 0.2s ease;
			padding: 0;
		}
		.login-main .login-bottom .center .item .action-btn svg {
			width: 16px;
			height: 16px;
		}
		.login-main .login-bottom .center .item .action-btn:hover {
			color: #148be4;
			background: #f3f6fa;
		}
		/* 显示条件:聚焦 或 有值 */
		.login-main .login-bottom .center .item:focus-within .action-btn,
		.login-main .login-bottom .center .item.has-value .action-btn {
			opacity: 1;
			transform: scale(1);
			pointer-events: auto;
		}
		/* 提示区小图标(保留原样) */
		.login-main .login-bottom .tip .icon-nocheck {
			display: inline-block;
			width: 10px;
			height: 10px;
			border-radius: 2px;
			border: solid 1px #9abcda;
			position: relative;
			top: 2px;
			margin: 1px 8px 1px 1px;
			cursor: pointer;
		}

		.login-main .login-bottom .tip .icon-check {
			margin: 0 7px 0 0;
			width: 14px;
			height: 14px;
			border: none;
			background: url(/static/admin/images/icon-login.png) no-repeat -111px -48px;
		}

		.login-main {
			width: 428px;
			position: relative;
			float: left;
		}

		.login-main .login-top {
			height: 117px;
			background-color: #148be4;
			border-radius: 12px 12px 0 0;
			font-family: SourceHanSansCN-Regular;
			font-size: 30px;
			font-weight: 400;
			font-stretch: normal;
			letter-spacing: 0;
			color: #fff;
			line-height: 117px;
			text-align: center;
			overflow: hidden;
			-webkit-transform: rotate(0);
			-moz-transform: rotate(0);
			-ms-transform: rotate(0);
			-o-transform: rotate(0);
			transform: rotate(0);
		}

		.login-main .login-top .bg1 {
			display: inline-block;
			width: 74px;
			height: 74px;
			background: #fff;
			opacity: .1;
			border-radius: 0 74px 0 0;
			position: absolute;
			left: 0;
			top: 43px;
		}

		.login-main .login-top .bg2 {
			display: inline-block;
			width: 94px;
			height: 94px;
			background: #fff;
			opacity: .1;
			border-radius: 50%;
			position: absolute;
			right: -16px;
			top: -16px;
		}

		.login-main .login-bottom {
			width: 428px;
			background: #fff;
			border-radius: 0 0 12px 12px;
			padding-bottom: 53px;
		}

		.login-main .login-bottom .center {
			width: 288px;
			margin: 0 auto;
			padding-top: 40px;
			padding-bottom: 15px;
			position: relative;
		}

		.login-main .login-bottom .tip {
			clear: both;
			height: 16px;
			line-height: 16px;
			width: 288px;
			margin: 0 auto;
		}

		.login-main .login-bottom .tip .login-tip {
			font-family: MicrosoftYaHei;
			font-size: 12px;
			font-weight: 400;
			font-stretch: normal;
			letter-spacing: 0;
			color: #9abcda;
			cursor: pointer;
		}

		.login-main .login-bottom .tip .forget-password {
			font-stretch: normal;
			letter-spacing: 0;
			color: #1391ff;
			text-decoration: none;
			position: absolute;
			right: 62px;
		}

		.login-main .login-bottom .login-btn {
			width: 288px;
			height: 40px;
			background-color: #1E9FFF;
			border-radius: 16px;
			margin: 24px auto 0;
			text-align: center;
			line-height: 40px;
			color: #fff;
			font-size: 14px;
			letter-spacing: 0;
			cursor: pointer;
			border: none;
			position: relative;
			overflow: hidden;
			transition: background-color 0.2s ease, transform 0.1s ease;
		}
		.login-main .login-bottom .login-btn:hover {
			background-color: #1b8de5;
		}
		.login-main .login-bottom .login-btn:active {
			transform: scale(0.99);
		}
		.login-main .login-bottom .login-btn:disabled,
		.login-main .login-bottom .login-btn.is-loading {
			background-color: #8ec5ff;
			cursor: not-allowed;
			pointer-events: none;
		}
		.login-main .login-bottom .login-btn.is-loading::after {
			content: '';
			position: absolute;
			right: 18px;
			top: 50%;
			width: 14px;
			height: 14px;
			margin-top: -7px;
			border: 2px solid rgba(255,255,255,0.45);
			border-top-color: #fff;
			border-radius: 50%;
			animation: btn-spin 0.8s linear infinite;
		}
		@keyframes btn-spin {
			to { transform: rotate(360deg); }
		}

		.footer {
			left: 0;
			bottom: 0;
			color: #fff;
			width: 100%;
			position: absolute;
			text-align: center;
			line-height: 30px;
			padding-bottom: 10px;
			text-shadow: #000 0.1em 0.1em 0.1em;
			font-size: 14px;
		}

		.padding-5 {
			padding: 5px !important;
		}

		.footer a,
		.footer span {
			color: #fff;
		}

		@media screen and (max-width:428px) {
			.login-main {
				width: 360px !important;
			}

			.login-main .login-top {
				width: 360px !important;
			}

			.login-main .login-bottom {
				width: 360px !important;
			}
		}
	

		/* Google 登录按钮 */
		.google-login-separator {
			text-align: center;
			margin: 12px auto;
			position: relative;
			width: 288px;
		}
		.google-login-separator::before,
		.google-login-separator::after {
			content: '';
			position: absolute;
			top: 50%;
			width: 110px;
			height: 1px;
			background: #e6e6e6;
		}
		.google-login-separator::before { left: 0; }
		.google-login-separator::after { right: 0; }
		.google-login-separator span {
			color: #9abcda;
			font-size: 12px;
			background: #fff;
			padding: 0 10px;
			position: relative;
		}
		.google-login-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			width: 288px;
			height: 40px;
			border: 1px solid #e6e6e6;
			border-radius: 16px;
			background: #fff;
			color: #333;
			font-size: 14px;
			text-decoration: none;
			cursor: pointer;
			transition: all 0.2s ease;
			margin: 0 auto;
		}
		.google-login-btn:hover {
			background: #f7f7f7;
			border-color: #d0d0d0;
			box-shadow: 0 2px 8px rgba(0,0,0,0.08);
		}
		.google-login-btn:active {
			transform: scale(0.99);
		}
		.google-icon {
			flex-shrink: 0;
		}</style>
</head>

<body>
	<canvas id="dynamic-bg"></canvas>
	<div class="main-body">
		<div class="login-main">
			<div class="login-top">
				<span>后台登录</span>
				<span class="bg1"></span>
				<span class="bg2"></span>
			</div>
			<form class="layui-form login-bottom" method="post">
				<div class="center">
					<div class="item" data-field="username">
						<span class="icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
						</span>
						<input type="text" name="username" lay-verify="required|account" lay-reqtext="登录账号为必填项" placeholder="输入登录账号或手机号或邮箱" autocomplete="username" autocapitalize="off" spellcheck="false" inputmode="text" class="layui-input" value="">
						<div class="actions">
							<button type="button" class="action-btn js-clear" aria-label="清除" tabindex="-1">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
							</button>
						</div>
						<span class="item-tip"></span>
					</div>
					<div class="item" data-field="password">
						<span class="icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
						</span>
						<input type="password" name="password" lay-verify="required|password" lay-reqtext="登录密码为必填项" placeholder="输入登录密码" autocomplete="current-password" autocapitalize="off" spellcheck="false" class="layui-input" value="">
						<div class="actions">
							<button type="button" class="action-btn js-toggle-pwd" aria-label="显示密码" tabindex="-1">
								<svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
								<svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
							</button>
						</div>
						<span class="item-tip"></span>
					</div>
					<div id="validatePanel" class="item is-compound" data-field="captcha">
						<span class="icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
						</span>
						<input type="text" id="captcha" name="captcha" lay-verify="required|captcha" lay-reqtext="图形验证码为必填项" placeholder="验证码" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="6" class="layui-input verification captcha" value="">
						<div class="actions">
							<img id="refreshCaptcha" onclick="this.src='/captcha?r' + Math.random();" class="validateImg" src="/captcha" alt="点击刷新验证码" title="点击刷新">
						</div>
						<span class="item-tip"></span>
					</div>
				</div>
				<div class="tip" style="display: none;">
					<span class="icon-nocheck"></span>
					<span class="login-tip">保持登录</span>
					<a href="javascript:" class="forget-password">忘记密码？</a>
				</div>
				<div class="layui-form-item" style="text-align:center; width:100%;height:100%;margin:0px;">
					<button class="login-btn" lay-submit="" lay-filter="login">立即登录</button>
				</div>
			</form>
		</div>
	</div>
	<div class="footer">
		©版权所有 {{.year}} {{.company}}<span class="padding-5">|</span><a target="_blank" href="http://www.miitbeian.gov.cn">豫ICP备18011027号</a>
	</div>
	<script src="/static/admin/lib/jquery-3.4.1/jquery-3.4.1.min.js" charset="utf-8"></script>
	<script src="/static/admin/lib/layui-v2.9.21/layui.js" charset="utf-8"></script>
	<script src="/static/admin/js/login.js?r={{.time}}" charset="utf-8"></script>
	<script>
		(function() {
			const bgEl = document.getElementById('dynamic-bg');
			// 直接在 #dynamic-bg 上绘制，避免 canvas 作为替换元素不参与子元素布局的问题
			const canvas = bgEl;
			canvas.classList.add('bg-particle-canvas');
			const ctx = canvas.getContext('2d');

			let width = 0, height = 0, dpr = 1;
			let particles = [];
			let shapes = [];
			let ripples = [];
			let stars = [];
			let meteors = [];
			let nextMeteorAt = 0;
			let mouseX = 0, mouseY = 0;
			let targetMX = 0, targetMY = 0;
			let time = 0;

			const colors = [
				'rgba(255,255,255,0.85)',
				'rgba(120,200,255,0.75)',
				'rgba(30,159,255,0.7)',
				'rgba(0,200,255,0.65)',
				'rgba(180,220,255,0.6)'
			];
			const particleCount = 80;

			function resize() {
				dpr = Math.min(window.devicePixelRatio || 1, 2);
				width = window.innerWidth;
				height = window.innerHeight;
				canvas.width = width * dpr;
				canvas.height = height * dpr;
				canvas.style.width = width + 'px';
				canvas.style.height = height + 'px';
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				targetMX = mouseX = width / 2;
				targetMY = mouseY = height / 2;
			}

			class Particle {
				constructor() { this.reset(true); }
				reset(init) {
					this.x = init ? Math.random() * width : Math.random() < 0.5 ? -50 : width + 50;
					this.y = init ? Math.random() * height : Math.random() * height;
					this.size = Math.random() * 2.4 + 0.6;
					this.speedX = (Math.random() - 0.5) * 0.5;
					this.speedY = (Math.random() - 0.5) * 0.5;
					this.color = colors[Math.floor(Math.random() * colors.length)];
					this.opacity = Math.random() * 0.5 + 0.2;
					this.pulse = Math.random() * Math.PI * 2;
					this.pulseSpeed = 0.005 + Math.random() * 0.012;
					this.shape = Math.floor(Math.random() * 4);
					this.trail = [];
				}
				update() {
					const dx = mouseX - this.x;
					const dy = mouseY - this.y;
					const dist = Math.sqrt(dx*dx + dy*dy);
					if (dist < 220 && dist > 0) {
						const force = (220 - dist) / 220 * 0.025;
						this.speedX += dx/dist * force;
						this.speedY += dy/dist * force;
						if (dist < 60) {
							this.speedX -= dx/dist * 0.05;
							this.speedY -= dy/dist * 0.05;
						}
					}
					this.x += this.speedX;
					this.y += this.speedY;
					this.pulse += this.pulseSpeed;
					this.speedX *= 0.985;
					this.speedY *= 0.985;
					this.trail.push({x: this.x, y: this.y});
					if (this.trail.length > 6) this.trail.shift();
					if (this.x < -60 || this.x > width + 60 || this.y < -60 || this.y > height + 60) this.reset(false);
				}
				draw() {
					if (this.trail.length > 1) {
						ctx.save();
						for (let i = 0; i < this.trail.length - 1; i++) {
							const t = i / this.trail.length;
							ctx.globalAlpha = this.opacity * t * 0.35;
							ctx.fillStyle = this.color;
							ctx.beginPath();
							ctx.arc(this.trail[i].x, this.trail[i].y, this.size * t * 0.6, 0, Math.PI * 2);
							ctx.fill();
						}
						ctx.restore();
					}
					ctx.save();
					const breathe = 0.75 + 0.35 * Math.sin(this.pulse);
					ctx.globalAlpha = this.opacity * breathe;
					ctx.fillStyle = this.color;
					ctx.shadowColor = this.color;
					ctx.shadowBlur = this.size * 4;
					const s = this.size * breathe;
					ctx.beginPath();
					if (this.shape === 0) {
						ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
					} else if (this.shape === 1) {
						ctx.rect(this.x - s, this.y - s, s * 2, s * 2);
					} else if (this.shape === 2) {
						for (let i = 0; i < 5; i++) {
							const a = (Math.PI * 2 * i) / 5 - Math.PI / 2;
							const px = this.x + Math.cos(a) * s;
							const py = this.y + Math.sin(a) * s;
							if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
						}
						ctx.closePath();
					} else {
						ctx.moveTo(this.x, this.y - s);
						ctx.lineTo(this.x + s, this.y + s);
						ctx.lineTo(this.x - s, this.y + s);
						ctx.closePath();
					}
					ctx.fill();
					ctx.restore();
				}
			}

			class FloatingShape {
				constructor() { this.reset(true); }
				reset(init) {
					this.x = Math.random() * width;
					this.y = init ? Math.random() * height : height + 80;
					this.size = Math.random() * 60 + 30;
					this.speedY = -(Math.random() * 0.3 + 0.1);
					this.speedX = (Math.random() - 0.5) * 0.2;
					this.rotation = Math.random() * Math.PI * 2;
					this.rotSpeed = (Math.random() - 0.5) * 0.004;
					this.type = Math.floor(Math.random() * 3);
					this.opacity = Math.random() * 0.06 + 0.03;
					this.colorSeed = Math.floor(Math.random() * 2);
				}
				update() {
					this.y += this.speedY;
					this.x += this.speedX;
					this.rotation += this.rotSpeed;
					if (this.y < -100) this.reset(false);
				}
				draw() {
					ctx.save();
					ctx.translate(this.x, this.y);
					ctx.rotate(this.rotation);
					ctx.globalAlpha = this.opacity;
					ctx.strokeStyle = (this.colorSeed === 0 ? 'rgba(255,255,255,' : 'rgba(120,200,255,') + '1)';
					ctx.lineWidth = 1.5;
					ctx.beginPath();
					if (this.type === 0) {
						ctx.arc(0, 0, this.size, 0, Math.PI * 2);
					} else if (this.type === 1) {
						for (let i = 0; i < 6; i++) {
							const a = (Math.PI * 2 * i) / 6;
							const px = Math.cos(a) * this.size;
							const py = Math.sin(a) * this.size;
							if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
						}
						ctx.closePath();
					} else {
						ctx.moveTo(0, -this.size);
						ctx.lineTo(this.size * 0.866, this.size * 0.5);
						ctx.lineTo(-this.size * 0.866, this.size * 0.5);
						ctx.closePath();
					}
					ctx.stroke();
					ctx.restore();
				}
			}

			function init() {
				resize();
				particles = [];
				for (let i = 0; i < particleCount; i++) particles.push(new Particle());
				shapes = [];
				for (let i = 0; i < 6; i++) shapes.push(new FloatingShape());

				// 增强 - 远处星空闪烁 (远景感, 不参与连线网络)
				stars = [];
				const starCount = Math.floor((width * height) / 12000);
				for (let i = 0; i < starCount; i++) {
					stars.push({
						x: Math.random() * width,
						y: Math.random() * height,
						r: Math.random() * 1.2 + 0.3,
						baseAlpha: Math.random() * 0.5 + 0.3,
						twinkleSpeed: 0.003 + Math.random() * 0.012,
						phase: Math.random() * Math.PI * 2
					});
				}

				// 增强 - 流星定时生成 (从屏幕顶部外侧斜着划过)
				nextMeteorAt = time + 2000 + Math.random() * 4000;
				window.addEventListener('resize', resize);
				window.addEventListener('mousemove', e => {
					targetMX = e.clientX;
					targetMY = e.clientY;
					bgEl.style.setProperty('--mx', (e.clientX / width * 100) + '%');
					bgEl.style.setProperty('--my', (e.clientY / height * 100) + '%');
				});
				window.addEventListener('click', e => {
					renderRipple(e.clientX, e.clientY);
				});
				bgEl.addEventListener('touchstart', e => {
					const t = e.touches[0];
					renderRipple(t.clientX, t.clientY);
				}, {passive: true});

				// === 输入框企业级交互 ===
				const items = document.querySelectorAll('.login-main .login-bottom .center .item');

				items.forEach(item => {
					const input = item.querySelector('input');
					const tip = item.querySelector('.item-tip');
					const clearBtn = item.querySelector('.js-clear');
					const toggleBtn = item.querySelector('.js-toggle-pwd');
					if (!input) return;

					// 1) has-value 同步
					const sync = () => {
						const v = input.value || '';
						item.classList.toggle('has-value', v.length > 0);
					};
					input.addEventListener('input', sync);
					sync();

					// 2) 输入时清除错误态
					input.addEventListener('input', () => {
						if (item.classList.contains('is-error')) {
							item.classList.remove('is-error');
							if (tip) tip.textContent = '';
						}
					});

					// 3) 清除按钮
					if (clearBtn) {
						clearBtn.addEventListener('mousedown', e => e.preventDefault());  // 防止按钮抢走焦点
						clearBtn.addEventListener('click', () => {
							input.value = '';
							sync();
							input.focus();
						});
					}

					// 4) 密码可见性切换
					if (toggleBtn) {
						const eyeOff = toggleBtn.querySelector('.eye-off');
						const eyeOn = toggleBtn.querySelector('.eye-on');
						toggleBtn.addEventListener('mousedown', e => e.preventDefault());
						toggleBtn.addEventListener('click', () => {
							const reveal = input.type === 'password';
							input.type = reveal ? 'text' : 'password';
							if (eyeOff) eyeOff.style.display = reveal ? 'none' : '';
							if (eyeOn) eyeOn.style.display = reveal ? '' : 'none';
							toggleBtn.setAttribute('aria-label', reveal ? '隐藏密码' : '显示密码');
						});
					}

					// 5) Esc 键清空当前项
					input.addEventListener('keydown', e => {
						if (e.key === 'Escape' && input.value) {
							input.value = '';
							sync();
						}
					});
				});

				// 6) 自动聚焦第一个输入框
				setTimeout(() => {
					const firstInput = document.querySelector('.login-main .login-bottom .center .item input');
					if (firstInput && !firstInput.value) firstInput.focus();
				}, 300);

				// 7) 暴露错误 API 给外部(login.js 调用)
				window.LoginForm = {
					setError(field, msg) {
						const item = document.querySelector(`.login-main .login-bottom .center .item[data-field="${field}"]`);
						if (!item) return;
						item.classList.add('is-error');
						const tip = item.querySelector('.item-tip');
						if (tip) tip.textContent = msg || '';
						// 重新触发动画(删除再添)
						item.style.animation = 'none';
						void item.offsetWidth;
						item.style.animation = '';
					},
					clearError(field) {
						const item = document.querySelector(`.login-main .login-bottom .center .item[data-field="${field}"]`);
						if (!item) return;
						item.classList.remove('is-error');
						const tip = item.querySelector('.item-tip');
						if (tip) tip.textContent = '';
					},
					clearAllErrors() {
						document.querySelectorAll('.login-main .login-bottom .center .item.is-error').forEach(it => {
							it.classList.remove('is-error');
							const t = it.querySelector('.item-tip');
							if (t) t.textContent = '';
						});
					}
				};

				animate();
			}

			function renderRipple(x, y) {
				renderRipples.push({
					x: x, y: y,
					radius: 0,
					maxRadius: 180 + Math.random() * 80,
					alpha: 0.5
				});
			}
			const renderRipples = [];

			function drawWaves() {
				const layers = [
					{ amp: 28, freq: 0.012, speed: 0.0007, y: 0.78, color: 'rgba(255,255,255,0.06)' },
					{ amp: 36, freq: 0.008, speed: 0.001,  y: 0.86, color: 'rgba(120,200,255,0.08)' },
					{ amp: 22, freq: 0.015, speed: 0.0013, y: 0.93, color: 'rgba(30,159,255,0.10)' }
				];
				layers.forEach(L => {
					ctx.save();
					ctx.beginPath();
					ctx.moveTo(0, height);
					const baseY = height * L.y;
					for (let x = 0; x <= width; x += 4) {
						const y = baseY + Math.sin(x * L.freq + time * L.speed * 60) * L.amp
						            + Math.cos(x * L.freq * 1.7 + time * L.speed * 40) * L.amp * 0.3;
						ctx.lineTo(x, y);
					}
					ctx.lineTo(width, height);
					ctx.closePath();
					const grad = ctx.createLinearGradient(0, baseY, 0, height);
					grad.addColorStop(0, L.color);
					grad.addColorStop(1, 'rgba(255,255,255,0)');
					ctx.fillStyle = grad;
					ctx.fill();
					ctx.restore();
				});
			}

			function drawConnections() {
				for (let i = 0; i < particles.length; i++) {
					const pi = particles[i];
					for (let j = i + 1; j < particles.length; j++) {
						const pj = particles[j];
						const dx = pi.x - pj.x;
						const dy = pi.y - pj.y;
						const dist = Math.sqrt(dx*dx + dy*dy);
						if (dist < 130) {
							ctx.save();
							ctx.globalAlpha = (1 - dist / 130) * 0.18;
							ctx.strokeStyle = '#7ec8ff';
							ctx.lineWidth = 0.6;
							ctx.beginPath();
							ctx.moveTo(pi.x, pi.y);
							ctx.lineTo(pj.x, pj.y);
							ctx.stroke();
							ctx.restore();
						}
					}
					const dx = mouseX - pi.x;
					const dy = mouseY - pi.y;
					const md = Math.sqrt(dx*dx + dy*dy);
					if (md < 160) {
						ctx.save();
						ctx.globalAlpha = (1 - md / 160) * 0.35;
						ctx.strokeStyle = '#ffffff';
						ctx.lineWidth = 0.8;
						ctx.beginPath();
						ctx.moveTo(pi.x, pi.y);
						ctx.lineTo(mouseX, mouseY);
						ctx.stroke();
						ctx.restore();
					}
				}
			}

			// 增强 - 远处星空: 绘制细小闪烁的星点 (微妙的深空感)
			function drawStars() {
				if (!stars.length) return;
				ctx.save();
				for (let i = 0; i < stars.length; i++) {
					const s = stars[i];
					const twinkle = Math.sin(time * s.twinkleSpeed + s.phase);
					const a = s.baseAlpha * (0.55 + 0.45 * twinkle);
					ctx.globalAlpha = a;
					ctx.fillStyle = '#ffffff';
					ctx.beginPath();
					ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.restore();
			}

			// 增强 - 流星轨迹: 定时从屏幕顶部外侧斜着划过的光束
			function drawMeteors() {
				// 随机生成流星
				if (time > nextMeteorAt) {
					const fromLeft = Math.random() < 0.5;
					meteors.push({
						x: fromLeft ? Math.random() * width * 0.3 : width - Math.random() * width * 0.3,
						y: -50,
						vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 2),
						vy: 2.5 + Math.random() * 1.5,
						len: 120 + Math.random() * 80,
						life: 0,
						maxLife: 60 + Math.random() * 30
					});
					nextMeteorAt = time + 3500 + Math.random() * 6000;
				}
				ctx.save();
				for (let i = meteors.length - 1; i >= 0; i--) {
					const m = meteors[i];
					m.life++;
					m.x += m.vx;
					m.y += m.vy;
					if (m.life > m.maxLife || m.y > height + 50) {
						meteors.splice(i, 1);
						continue;
				}
					const tail = m.x - m.vx * (m.len / Math.hypot(m.vx, m.vy));
					const tailY = m.y - m.vy * (m.len / Math.hypot(m.vx, m.vy));
					const alpha = 1 - m.life / m.maxLife;
					const grad = ctx.createLinearGradient(m.x, m.y, tail, tailY);
					grad.addColorStop(0, 'rgba(255,255,255,' + (0.9 * alpha) + ')');
					grad.addColorStop(0.5, 'rgba(180,220,255,' + (0.5 * alpha) + ')');
					grad.addColorStop(1, 'rgba(120,180,255,0)');
					ctx.strokeStyle = grad;
					ctx.lineWidth = 1.6;
					ctx.beginPath();
					ctx.moveTo(m.x, m.y);
					ctx.lineTo(tail, tailY);
					ctx.stroke();
					// 流星头部亮点
					ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
					ctx.beginPath();
					ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.restore();
			}

			function drawMouseGlow() {
				const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 180);
				grad.addColorStop(0, 'rgba(255,255,255,0.10)');
				grad.addColorStop(0.5, 'rgba(120,200,255,0.05)');
				grad.addColorStop(1, 'rgba(30,159,255,0)');
				ctx.fillStyle = grad;
				ctx.fillRect(mouseX - 180, mouseY - 180, 360, 360);
			}

			function drawRipples() {
				for (let i = renderRipples.length - 1; i >= 0; i--) {
					const r = renderRipples[i];
					r.radius += 1.2;
					r.alpha *= 0.985;
					if (r.radius >= r.maxRadius || r.alpha < 0.01) {
						renderRipples.splice(i, 1);
						continue;
					}
					ctx.save();
					ctx.globalAlpha = r.alpha;
					ctx.strokeStyle = '#ffffff';
					ctx.lineWidth = 2;
					ctx.beginPath();
					ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
					ctx.stroke();
					ctx.restore();
				}
			}

			// 在 canvas 上自绘动态背景（不再依赖 CSS background）
			function drawAnimatedBackground() {
				// 主对角渐变：色相随时间缓慢漂移
				const t = time * 0.0008;
				const angle = Math.PI * 0.25 + Math.sin(t * 0.6) * 0.15;
				const x0 = width / 2 - Math.cos(angle) * width;
				const y0 = height / 2 - Math.sin(angle) * height;
				const x1 = width / 2 + Math.cos(angle) * width;
				const y1 = height / 2 + Math.sin(angle) * height;
				const g = ctx.createLinearGradient(x0, y0, x1, y1);
				const stops = [
					[0.00, [10, 42, 94]],
					[0.20, [20, 139, 228]],
					[0.40, [30, 159, 255]],
					[0.60, [0, 160, 233]],
					[0.80, [0, 122, 204]],
					[1.00, [10, 42, 94]]
				];
				stops.forEach(([pos, rgb]) => {
					const p = (pos + t) % 1;
					g.addColorStop(p, 'rgb(' + rgb.join(',') + ')');
				});
				ctx.fillStyle = g;
				ctx.fillRect(0, 0, width, height);

				// 鼠标位置全局光晕
				const radial = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, Math.max(width, height) * 0.7);
				radial.addColorStop(0, 'rgba(255, 255, 255, 0.20)');
				radial.addColorStop(0.25, 'rgba(180, 220, 255, 0.08)');
				radial.addColorStop(0.6, 'rgba(30, 159, 255, 0.02)');
				radial.addColorStop(1, 'rgba(0, 0, 0, 0)');
				ctx.fillStyle = radial;
				ctx.fillRect(0, 0, width, height);

				// 漂浮光晕球（柔和脉动）
				const orbs = [
					{ x: 0.15 + 0.04 * Math.sin(t * 1.3), y: 0.25 + 0.03 * Math.cos(t * 1.1), r: 0.35, c: 'rgba(255,255,255,0.10)' },
					{ x: 0.85 + 0.03 * Math.cos(t * 1.5), y: 0.15 + 0.02 * Math.sin(t * 1.7), r: 0.30, c: 'rgba(120,200,255,0.10)' },
					{ x: 0.75 + 0.05 * Math.sin(t * 0.9), y: 0.80 + 0.03 * Math.cos(t * 1.4), r: 0.32, c: 'rgba(180,220,255,0.08)' },
					{ x: 0.25 + 0.03 * Math.cos(t * 1.6), y: 0.75 + 0.04 * Math.sin(t * 1.2), r: 0.28, c: 'rgba(100,180,255,0.09)' },
					{ x: 0.50 + 0.06 * Math.sin(t * 1.0), y: 0.50 + 0.04 * Math.cos(t * 0.8), r: 0.40, c: 'rgba(200,230,255,0.06)' }
				];
				orbs.forEach(o => {
					const cx = o.x * width;
					const cy = o.y * height;
					const cr = o.r * Math.max(width, height);
					const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
					rg.addColorStop(0, o.c);
					rg.addColorStop(1, 'rgba(0,0,0,0)');
					ctx.fillStyle = rg;
					ctx.fillRect(0, 0, width, height);
				});

				// === 装饰图形:星星、月亮、太阳(替换原太极) ===
				// 整体亮度:从原版 → 1/4 → 当前 1/12(更含蓄不抢戏)
				const decoT = time * 0.001;
				const unit = Math.min(width, height);

				// 1) 五角星:左上角,缓慢自转 + 闪烁脉动
				(function() {
					const cx = width * 0.18, cy = height * 0.22;
					const outerR = unit * 0.085;
					const breathe = 0.9 + 0.1 * Math.sin(decoT * 1.8);
					const R = outerR * breathe;

					ctx.save();
					ctx.translate(cx, cy);
					ctx.rotate(decoT * 0.6);
					ctx.globalAlpha = 0.053;  // 原 0.65 → 1/4 = 0.16 → 再 ÷3 ≈ 0.053

					// 光晕(原 0.25 → 0.06 → 再 ÷3 ≈ 0.02)
					const halo = ctx.createRadialGradient(0, 0, R * 0.4, 0, 0, R * 1.8);
					halo.addColorStop(0, 'rgba(255,255,255,0.02)');
					halo.addColorStop(1, 'rgba(0,0,0,0)');
					ctx.fillStyle = halo;
					ctx.beginPath();
					ctx.arc(0, 0, R * 1.8, 0, Math.PI * 2);
					ctx.fill();

					// 5 角星:10 个顶点(5 外点 + 5 内点)
					const points = 5;
					const innerR = R * 0.42;
					const step = Math.PI / points;
					ctx.fillStyle = '#ffffff';
					ctx.beginPath();
					for (let i = 0; i < points * 2; i++) {
						const r = (i % 2 === 0) ? R : innerR;
						const a = -Math.PI / 2 + i * step;
						const x = Math.cos(a) * r;
						const y = Math.sin(a) * r;
						if (i === 0) ctx.moveTo(x, y);
						else ctx.lineTo(x, y);
					}
					ctx.closePath();
					ctx.fill();
					ctx.restore();
				})();

				// 2) 新月:右上角,相位随时间缓慢变化(盈亏循环)
				(function() {
					const cx = width * 0.82, cy = height * 0.24;
					const R = unit * 0.075;

					ctx.save();
					ctx.translate(cx, cy);
					ctx.rotate(decoT * 0.15);
					ctx.globalAlpha = 0.05;  // 原 0.6 → 1/4 = 0.15 → 再 ÷3 ≈ 0.05

					// 光晕(原 0.22 → 0.055 → 再 ÷3 ≈ 0.018)
					const halo = ctx.createRadialGradient(0, 0, R * 0.4, 0, 0, R * 1.8);
					halo.addColorStop(0, 'rgba(255,255,255,0.018)');
					halo.addColorStop(1, 'rgba(0,0,0,0)');
					ctx.fillStyle = halo;
					ctx.beginPath();
					ctx.arc(0, 0, R * 1.8, 0, Math.PI * 2);
					ctx.fill();

					// 月亮本体(满圆)
					ctx.fillStyle = '#ffffff';
					ctx.beginPath();
					ctx.arc(0, 0, R, 0, Math.PI * 2);
					ctx.fill();

					// 用 destination-out 擦除一个偏移圆,形成月牙
					// phase 在 -1 ~ 1 间缓慢振荡,正=右凸弦月,负=左凸弦月
					const phase = Math.sin(decoT * 0.4);
					ctx.save();
					ctx.globalCompositeOperation = 'destination-out';
					ctx.beginPath();
					ctx.arc(phase * R * 0.85, 0, R * 0.95, 0, Math.PI * 2);
					ctx.fill();
					ctx.restore();

					ctx.restore();
				})();

				// 3) 太阳:右下角,12 道光芒 + 中心圆,缓慢顺时针
				(function() {
					const cx = width * 0.85, cy = height * 0.78;
					const R = unit * 0.075;
					const pulse = 1.0 + 0.08 * Math.sin(decoT * 1.3);

					ctx.save();
					ctx.translate(cx, cy);
					ctx.rotate(decoT * 0.35);
					ctx.globalAlpha = 0.05;  // 原 0.6 → 1/4 = 0.15 → 再 ÷3 ≈ 0.05

					// 金色光晕(原 0.30/0.10 → 0.075/0.025 → 再 ÷3 ≈ 0.025/0.008)
					const halo = ctx.createRadialGradient(0, 0, R * 0.4, 0, 0, R * 2.0 * pulse);
					halo.addColorStop(0, 'rgba(255,220,150,0.025)');
					halo.addColorStop(0.6, 'rgba(255,200,120,0.008)');
					halo.addColorStop(1, 'rgba(0,0,0,0)');
					ctx.fillStyle = halo;
					ctx.beginPath();
					ctx.arc(0, 0, R * 2.0 * pulse, 0, Math.PI * 2);
					ctx.fill();

					// 12 道光芒(三角形):内缘 R*0.7,外缘 R*1.3*pulse
					const rays = 12;
					const innerR = R * 0.7;
					const outerR = R * 1.3 * pulse;
					ctx.fillStyle = '#ffffff';
					ctx.beginPath();
					for (let i = 0; i < rays; i++) {
						const a1 = (i / rays) * Math.PI * 2;
						const a2 = ((i + 0.5) / rays) * Math.PI * 2;
						const a3 = ((i + 1) / rays) * Math.PI * 2;
						const x1 = Math.cos(a1) * innerR;
						const y1 = Math.sin(a1) * innerR;
						const x2 = Math.cos(a2) * outerR;
						const y2 = Math.sin(a2) * outerR;
						const x3 = Math.cos(a3) * innerR;
						const y3 = Math.sin(a3) * innerR;
						if (i === 0) ctx.moveTo(x1, y1);
						ctx.lineTo(x2, y2);
						ctx.lineTo(x3, y3);
					}
					ctx.closePath();
					ctx.fill();

					// 中心圆
					ctx.fillStyle = '#ffffff';
					ctx.beginPath();
					ctx.arc(0, 0, R * 0.7, 0, Math.PI * 2);
					ctx.fill();

					ctx.restore();
				})();
			}

			function animate() {
				time++;
				mouseX += (targetMX - mouseX) * 0.08;
				mouseY += (targetMY - mouseY) * 0.08;

				// 动态渐变背景（替代 CSS 渐变 + 之前被 clearRect 清掉的部分）
				drawAnimatedBackground();
				drawStars();
				drawMeteors();
				drawMouseGlow();
				for (let i = 0; i < shapes.length; i++) {
					shapes[i].update();
					shapes[i].draw();
				}
				drawWaves();
				for (let i = 0; i < particles.length; i++) {
					particles[i].update();
					particles[i].draw();
				}
				drawConnections();
				drawRipples();
				requestAnimationFrame(animate);
			}
			// 修复: 文档已加载完时直接调用 init(), 否则动画系统不启动
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', init);
			} else {
				init();
			}
		})();
	</script>
</body>
</html>
