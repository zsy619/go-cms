<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
        <div class="layui-tab layui-tab-brief layui-tab-card">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
                <li>账号信息</li>
                <li>联系方式</li>
                <li>其他信息</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 姓名
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="hidden" name="user_id" value="{{.mdl.UserID}}">
                            <input type="text" name="real_name" value="{{.mdl.RealName}}" lay-verify="required" lay-reqtext="姓名为必填项" autocomplete="off" placeholder="请输入姓名" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">性别</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="sex" value="1" title="男" {{if eq .mdl.Sex 1}}checked="checked" {{end}}>
                            <input type="radio" name="sex" value="2" title="女" {{if eq .mdl.Sex 2}}checked="checked" {{end}}>
                            <input type="radio" name="sex" value="0" title="未知" {{if eq .mdl.Sex 0}}checked="checked" {{end}}>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 昵称
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="nick_name" value="{{.mdl.NickName}}" lay-verify="required" lay-reqtext="昵称为必填项" autocomplete="off" placeholder="请输入昵称" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">身份证号</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="id_card" value="{{.mdl.IDCard}}" autocomplete="off" placeholder="请输入身份证号" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">头像</label>
                        <div class="layui-input-inline" style="width: 392px;">
                            <input type="text" name="avatar" value="{{.mdl.Avatar}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <button type="button" class="layui-btn layui-btn-primary" id="btnUpload">
                            <i class="layui-icon">&#xe67c;</i>浏览...
                        </button>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">排序号</label>
                        <div class="layui-input-inline" style="width: 80px;">
                            <input type="number" name="sort_id" lay-verify="number" value="{{.mdl.SortID}}" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">数字，越小越向前</div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 管理角色
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <select name="role_id" lay-verify="required" lay-reqtext="管理角色为必选项">
                                <option value="">选择角色</option>
                                {{range $key, $value := .roleList}}
                                <option value="{{$value.RoleID}}" {{if eq $.mdl.RoleID $value.RoleID}}selected="" {{end}}>{{$value.Name}}</option>
                                {{end}}
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 登录账号
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="user_name" value="{{.mdl.UserName}}" lay-verify="required" lay-reqtext="登录账号为必填项" autocomplete="off" placeholder="请输入登录账号" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            {{if eq .mdl.UserID 0}}<font color="red">*</font> {{end}}登录密码
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="password" name="password" value="" {{if eq .mdl.UserID 0}}lay-verify="required" lay-reqtext="登录密码为必填项" {{end}} autocomplete="off" placeholder="请输入登录密码" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">是否可用</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="enabled" value="1" title="可用" {{if .mdl.Enabled}}checked="checked" {{end}}>
                            <input type="radio" name="enabled" value="0" title="禁用" {{if eq .mdl.Enabled false}}checked="checked" {{end}}>
                        </div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">电子邮箱</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="email" value="{{.mdl.Email}}" autocomplete="off" placeholder="请输入电子邮箱" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">固话</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="telphone" value="{{.mdl.Telphone}}" autocomplete="off" placeholder="请输入固话" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机号码</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="mobile" value="{{.mdl.Mobile}}" autocomplete="off" placeholder="请输入手机号码" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">发布审核</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="is_audit" value="1" title="启用" {{if .mdl.Enabled}}checked="checked" {{end}}>
                            <input type="radio" name="is_audit" value="0" title="禁用" {{if eq .mdl.Enabled false}}checked="checked" {{end}}>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">用户类别</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <select name="user_type">
                                <option value="0">系统管理员</option>
                                <option value="1">高校管理员</option>
                                <option value="2">求职者</option>
                                <option value="3">用人单位</option>
                                <option value="4">教师</option>
                            </select>
                        </div>
                        <div class="layui-form-mid layui-word-aux">根据业务需求自定义用户类别</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">特征标识</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="user_number" value="{{.mdl.UserNumber}}" autocomplete="off" placeholder="请输入身份证号" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">其他唯一特征标识：如教职工的工号或学生的学号</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">备注</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <textarea name="remark" placeholder="请输入描述信息" class="layui-textarea">{{.mdl.Remark}}</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;">
                <!-- <button class="layui-btn" id="btnSubmit">立即提交</button> -->
                <button class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
            </div>
        </div>
    </form>
</div>
<script>
    layui.use(['form', 'layer', 'wangEditor', 'upload'], function () {
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer,
            wangEditor = layui.wangEditor;
        var upload = layui.upload;

        //执行实例
        var uploadInst = upload.render({
            elem: '#btnUpload' //绑定元素
            , url: '/admin/tools/ImageUpload' //上传接口
            , done: function (res) {
                //上传完毕回调
                if (res.code == 0) {
                    $("input[name='img_url']").val(res.file.url2);
                } else {
                    layer.msg(res.msg);
                }
            }
            , error: function () {
                //请求异常回调
            }
        });

        //自定义验证规则
        form.verify({
            // title: function (value) {
            //     if (value.length < 5) {
            //         return '标题也太短了吧';
            //     }
            // }
            // , pass: [/(.+){6,12}$/, '密码必须6到12位']
            // , money: [
            //     /^\d+\.\b\d{2}\b$/
            //     , '金额必须为小数保留两位'
            // ]
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            console.log(data)
            // alert(JSON.stringify(data.field));
            return false;
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            form.submit('frmEdit', function (data) {
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/admin/AdminSave", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        console.log(data);
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
