<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
        <div class="layui-tab layui-tab-brief layui-tab-card">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
                <li>管理权限</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 角色类型
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="hidden" name="role_id" value="{{.mdl.RoleID}}">
                            <select name="type" lay-verify="required" lay-search="" lay-reqtext="角色类型为必选项">
                                <option value="">请选择</option>
                                <option value="supper" {{if eq .mdl.Type "supper" }} selected="" {{end}}>超级用户</option>
                                <option value="system" {{if eq .mdl.Type "system" }} selected="" {{end}}>系统用户</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            <font color="red">*</font> 角色名称
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="name" value="{{.mdl.Name}}" lay-verify="required" lay-reqtext="角色为必填项" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">角色名称确保唯一</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">排序号</label>
                        <div class="layui-input-inline" style="width: 80px;">
                            <input type="number" name="sort_id" lay-verify="number" value="{{.mdl.SortID}}" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">数字，越小越向前</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">备注</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <textarea name="remark" placeholder="" class="layui-textarea">{{.mdl.Remark}}</textarea>
                        </div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="layui-form-item" style="margin: 10px;">
                        <div class="layui-btn-container layui-btn-group">
                            <button type="button" class="layui-btn layui-btn-sm" id="btn-expand">全部展开</button>
                            <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="btn-fold">全部折叠</button>
                        </div>
                    </div>
                    <table id="tabNav" class="layui-table" lay-filter="tabNav"></table>
                    <input type="hidden" name="action" value="">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;">
                <!-- <button class="layui-btn" id="btnSubmit">立即提交</button> -->
                <button class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
            </div>
        </div>
    </form>
</div>
<script>
    var actionChn = { "Show": "显示", "View": "查看", "Add": "添加", "Edit": "修改", "Delete": "删除", "Audit": "审核" };
    layui.use(['form', 'layer', 'wangEditor', 'upload', 'treetable'], function () {
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer,
            wangEditor = layui.wangEditor;
        var upload = layui.upload;
        var treetable = layui.treetable;

        form.on('checkbox(nav-id)', function (data) {
            var nav_id = $(data.elem).attr('data-index');
            var chk = data.elem.checked;
            $("input[data-index='" + nav_id + "']").each(function () {
                $(this).prop("checked", chk);
            });
            form.render();
        });

        layer.load(2);
        treetable.render({
            treeColIndex: 1,
            treeSpid: 0,
            treeIdName: 'nav_id',
            treePidName: 'parent_id',
            elem: '#tabNav',
            url: '/admin/admin/NavFind?roleId={{.mdl.RoleID}}',
            page: false,
            even: true,
            size: 'lg',
            cols: [[
                { type: 'numbers' },
                { field: 'title', minWidth: 200, title: '权限名称' },
                { field: 'name', width: 160, title: '权限标识' },
                { field: 'link_url', title: '菜单url' },
                { field: 'sort_id', width: 80, align: 'center', title: '排序号' },
                {
                    field: 'action', title: "权限分配", templet: function (d) {
                        var outHtml = "";
                        if (d.action != null) {
                            var actions = d.action.split(',');
                            var len = actions.length;
                            for (var i = 0; i < len; i++) {
                                var item = actions[i];
                                outHtml += '<input type="checkbox" id="' + d.name + '_' + d.nav_id + '_' + item + '" data-key="' + d.name + '" data-index="' + d.nav_id + '" value="' + item + '" lay-skin="primary" lay-filter="">';
                                outHtml += '<label for="' + d.name + '_' + d.nav_id + '_' + item + '">' + actionChn[item] + '</label>'
                            }
                        }
                        return outHtml;
                    }
                },
                {
                    field: 'is_sys', width: 90, align: 'center', title: '选择', templet: function (d) {
                        return '<input type="checkbox" data-index="' + d.nav_id + '" lay-skin="primary" lay-filter="nav-id">';
                    }
                },
            ]],
            done: function () {
                layer.closeAll('loading');
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/admin/RoleValueFind?roleId={{.mdl.RoleID}}", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        console.log(data);
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            var len = data.data.length;
                            for (var i = 0; i < len; i++) {
                                var item = data.data[i];
                                var nav_name = item.nav_name;
                                var actions = item.action.split(',');
                                var len2 = actions.length;
                                for (var j = 0; j < len2; j++) {
                                    var action = actions[j];
                                    $("input[data-key='" + nav_name + "'][value='" + action + "']").prop("checked", true);
                                }
                            }
                            form.render();
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            }
        });

        $('#btn-expand').click(function () {
            treetable.expandAll('#tabNav');
        });

        $('#btn-fold').click(function () {
            treetable.foldAll('#tabNav');
        });

        //自定义验证规则
        form.verify({
            // title: function (value) {
            //     if (value.length < 5) {
            //         return '标题也太短了吧';
            //     }
            // }
            // , pass: [/(.+){6,12}$/, '密码必须6到12位']
            // , money: [
            //     /^\d+\.\b\d{2}\b$/
            //     , '金额必须为小数保留两位'
            // ]
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            console.log(data)
            // alert(JSON.stringify(data.field));
            return false;
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            var actions = {};
            $('input[data-key]:checked').each(function (idx, obj) {
                var key = $(obj).attr("data-key");
                var val = $(obj).val();
                if (actions[key]) {
                    actions[key] += "," + val;
                } else {
                    actions[key] = val;
                }
            });
            console.log(JSON.stringify(actions));
            $('input[name=action]').val(JSON.stringify(actions));
            // console.log($('#frmEdit').serialize());
            // return false;
            form.submit('frmEdit', function (data) {
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/admin/RoleSave", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        // console.log(data);
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
