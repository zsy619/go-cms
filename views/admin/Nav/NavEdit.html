<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit" enctype="multipart/form-data">
        <div class="layui-tab layui-tab-brief layui-tab-card">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">归属节点</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="hidden" name="site_id" value="{{.mdl.SiteID}}">
                            <input type="hidden" name="channel_id" value="{{.mdl.ChannelID}}">
                            <input type="hidden" name="parent_id" value="{{.mdl.ParentID}}">
                            <input type="hidden" name="nav_id" value="{{.mdl.NavID}}">
                            <input type="text" name="tree" id="tree" lay-filter="tree" autocomplete="off" lay-verify="required" lay-reqtext="选择归属节点" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label required">导航类别</label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input type="radio" name="type" value="System" title="系统" {{if eq .mdl.Type "System"}}checked="checked" {{end}}>
                        <input type="radio" name="type" value="Site" title="站点" {{if eq .mdl.Type "Site"}}checked="checked" {{end}}>
                        <input type="radio" name="type" value="Channel" title="频道" {{if eq .mdl.Type "Channel"}}checked="checked" {{end}}>
                        <input type="radio" name="type" value="Article" title="文章" {{if eq .mdl.Type "Article"}}checked="checked" {{end}}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label required">导航标识</label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input type="text" name="name" value="{{.mdl.Name}}" lay-verify="required|call_index" lay-reqtext="导航标识为必填项" autocomplete="off" placeholder="请输入导航标识" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label required">
                        导航名称
                    </label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input type="text" name="title" value="{{.mdl.Title}}" maxlength="128" lay-verify="required" lay-reqtext="内容标题为必填项" autocomplete="off" placeholder="" class="layui-input">
                    </div>
                    <div class="layui-form-mid layui-word-aux">导航名称最多128个字符</div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">导航副标题</label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input type="text" name="sub_title" value="{{.mdl.SubTitle}}" maxlength="128" autocomplete="off" placeholder="" class="layui-input">
                    </div>
                    <div class="layui-form-mid layui-word-aux">导航副标题最多128个字符</div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">图标地址</label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input type="text" name="icon_url" value="{{.mdl.IconURL}}" lay-verify="" lay-reqtext="" autocomplete="off" placeholder="请输入图标地址" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">导航链接</label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input type="text" name="link_url" value="{{.mdl.LinkURL}}" lay-verify="" lay-reqtext="" autocomplete="off" placeholder="请输入导航链接" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">选项</label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input name="is_hide" type="checkbox" value="1" title="隐藏" {{if eq .mdl.IsHide 1}} checked="" {{end}}>
                        <input name="is_sys" type="checkbox" value="1" title="系统默认" {{if eq .mdl.IsSys 1}} checked="" {{end}}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">排序号</label>
                    <div class="layui-input-inline" style="width: 80px;">
                        <input type="number" name="sort_id" lay-verify="number" value="{{.mdl.SortID}}" class="layui-input">
                    </div>
                    <div class="layui-form-mid layui-word-aux">数字，越小越向前</div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">权限资源</label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input type="text" name="action" value="{{.mdl.Action}}" lay-verify="" lay-reqtext="" autocomplete="off" placeholder="请输入权限资源,英文逗号隔开" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-inline" style="width: 500px;">
                        <input type="text" name="remark" value="{{.mdl.Remark}}" maxlength="128" autocomplete="off" placeholder="" class="layui-input">
                    </div>
                    <div class="layui-form-mid layui-word-aux">备注最多128个字符</div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;">
                <button type="button" class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
            </div>
        </div>
    </form>
</div>

<script>
    layui.use(['form', 'layer', 'laydate', 'treeSelect'], function (){
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer,
            laydate = layui.laydate,
            treeSelect = layui.treeSelect;

        laydate.render({
            elem: '#publish_time', type: 'datetime'
        });

        treeSelect.render({
            elem: '#tree',
            data: '/admin/nav/NavTree?navId={{.navId}}',
            type: 'POST',
            placeholder: '归属节点',
            search: true,
            style: {
                line: {
                    enable: true
                }
            },
            click: function (d) {
                $("input[name='nav_id']").val(d.current.id);
            },
            success: function (d) {
                var navId = parseInt($("input[name='nav_id']").val());
                if (navId != 0) {
                    treeSelect.checkNode('tree', navId);
                    treeSelect.refresh('tree');
                }
            }
        });

        //自定义验证规则
        form.verify({
            call_index: [/^[a-zA-Z0-9\-\_]{2,50}$/, '请填写正确的导航标识'],
            template: function (value, item) {
                var exp = /(.+?)?.html/;
                if (value && !exp.test(value)) {
                    return '导航标识格式不正确';
                }
            }
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            ue.sync();
            $("#myEditor").val(ue.getContent());
            form.submit('frmEdit', function (data) {
                data.field.content = UE.getEditor('editor').getContent();
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/nav/NavSave", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
