<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">学历</label>
                            <div class="layui-input-inline">
                                <select name="degree">
                                    <option value="">请选择</option>
                                    <option value="中专">中专</option>
                                    <option value="大专">大专</option>
                                    <option value="本科">本科</option>
                                    <option value="硕士">硕士</option>
                                    <option value="博士">博士</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">姓名</label>
                            <div class="layui-input-inline">
                                <input type="text" name="realName" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">专业</label>
                            <div class="layui-input-inline">
                                <input type="text" name="special" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">是否已读</label>
                            <div class="layui-input-inline">
                                <select name="isRead">
                                    <option value="-1">请选择</option>
                                    <option value="0">未读</option>
                                    <option value="1">已读</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">标签</label>
                            <div class="layui-input-inline">
                                <input type="text" name="tags" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">备注</label>
                            <div class="layui-input-inline">
                                <input type="text" name="remark" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary layui-btn-radius" lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <table class="layui-hide" id="tableContainer" lay-filter="currentTableFilter"></table>
    </div>
</div>
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container layui-btn-group">
        <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add"><i class="layui-icon layui-icon-addition"></i>添加</button>
        <button class="layui-btn layui-btn-primary layui-btn-sm data-add-btn" lay-event="audit"><i class="layui-icon layui-icon-ok"></i>设置已读</button>
        <button class="layui-btn layui-btn-danger layui-btn-sm data-add-btn" lay-event="reject"><i class="layui-icon layui-icon-close"></i>设置未读</button>
    </div>
</script>
<script type="text/html" id="currentTableBar">
    <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit layui-btn-radius" lay-event="edit"><i class="layui-icon layui-icon-view"></i>浏览</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete layui-btn-radius" lay-event="delete"><i class="layui-icon layui-icon-close"></i>删除</a>
</script>
<script>
    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        table.render({
            elem: '#tableContainer',
            url: '/admin/plg/register/paginate?isRead=-1',
            toolbar: '#toolbarDemo',
            height: "full-180",
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                { type: "checkbox", width: 50 },
                { field: 'register_id', width: 80, title: 'ID', sort: true },
                { field: 'real_name', title: '姓名' },
                { field: 'sex', width: 80, title: '性别', sort: true },
                { field: 'year', width: 80, title: '年龄' },
                { field: 'special', title: '意向专业' },
                { field: 'mobile', title: '联系电话', width: 120 },
                { field: 'email', title: '电子邮箱', width: 150 },
                { field: 'wechat', title: '微信号', width: 120 },
                { field: 'address', title: '家庭地址', width: 280 },
                { field: 'content', title: '留言内容', width: 280 },
                {
                    field: 'create_time', title: '提交时间', width: 180, templet: function (d) {
                        return layui.util.toDateString(d.create_time, 'yyyy-MM-dd HH:mm:ss');
                    }
                },
                {
                    field: 'ip', title: '提交IP', width: 120
                },
                {
                    field: 'is_read', title: '是否已读', width: 90, align: "center", templet: function (d) {
                        return d.is_read == 1 ? '<span class="layui-badge layui-bg-green">已读</span>' : '<span class="layui-badge layui-bg-gray">未读</span>';
                    }
                },
                { field: 'tags', title: '标签', width: 120 },
                { field: 'remark', title: '备注', width: 180 },
                { title: '操作', width: 150, toolbar: '#currentTableBar', align: "center", fixed: "right" }
            ]],
            limits: [10, 15, 20, 25, 50, 100],
            limit: 20,
            page: true,
            // skin: 'line',
            even: true,
            size: 'lg',
            done: function () {
                $(".layui-table-main tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-body tbody tr")[index]).height($(val).height());
                    });
                });
                $(".layui-table-header tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-header thead tr")[index]).height($(val).height());
                    });
                });
            }
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            var result = JSON.stringify(data.field);
            // console.log(result);
            //执行搜索重载
            table.reload('tableContainer', {
                page: {
                    curr: 1
                }
                , where: {
                    realName: $("input[name='realName']").val(),
                    special: $("input[name='special']").val(),
                    degree: $("select[name='degree']").val(),
                    tags: $("input[name='tags']").val(),
                    remark: $("input[name='remark']").val(),
                    isRead: parseInt($("select[name='isRead']").val()),
                }
            }, 'data');

            return false;
        });

        /**
         * toolbar监听事件
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'add') {  // 监听添加操作
                var index = layer.open({
                    title: '添加',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: '/admin/plg/register/edit',
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            } else if (obj.event === 'audit') {
                var checkStatus = table.checkStatus('tableContainer');
                var data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要操作的数据", { icon: 2, time: 1000 });
                    return false;
                }
                var ids = [];
                for (var i = 0; i < data.length; i++) {
                    ids.push(data[i].register_id);
                }
                changeRead(ids, 1);
            } else if (obj.event === 'reject') {
                var checkStatus = table.checkStatus('tableContainer');
                var data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要操作的数据", { icon: 2, time: 1000 });
                    return false;
                }
                var ids = [];
                for (var i = 0; i < data.length; i++) {
                    ids.push(data[i].register_id);
                }
                changeRead(ids, 0);
            }
        });

        function changeRead(ids, is_read) {
            $.ajax({
                type: "POST",
                url: "/admin/plg/register/read", //提交的地址
                data: JSON.stringify({
                    "register_ids": ids,
                    "is_read": is_read,
                }),
                async: false,
                beforeSend: function () { //当一个Ajax请求开始时触发
                    this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                },
                error: function (request) {  //失败的话
                },
                success: function (data) {  //成功
                    if (data.code == CodeSuccess) {
                        layer.msg("设置成功", { icon: 1, time: 1000 }, function () {
                            $('button[lay-filter="data-search-btn"]').click();
                        });
                    } else {
                        layer.msg(data.msg, { icon: 2, time: 1000 });
                    }
                },
                complete: function () {
                    layer.closeAll();
                    layer.close(this.layerIndex);
                },
            });
        }

        //监听表格复选框选择
        table.on('checkbox(currentTableFilter)', function (obj) {
            console.log(obj)
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            var data = obj.data;
            if (obj.event === 'edit') {
                console.log(data);
                var index = layer.open({
                    title: '浏览',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: '/admin/plg/register/Edit?registerId=' + data.register_id,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else if (obj.event === 'delete') {
                layer.confirm('真的删除行么', function (index) {
                    $.ajax({
                        type: "POST",
                        url: "/admin/plg/register/destory", //提交的地址
                        data: {
                            "registerId": data.register_id
                        },
                        async: false,
                        beforeSend: function () { //当一个Ajax请求开始时触发
                            this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                        },
                        error: function (request) {  //失败的话
                        },
                        success: function (data) {  //成功
                            if (data.code == CodeSuccess) {
                                layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                    $('button[lay-filter="data-search-btn"]').click();
                                });
                            } else {
                                layer.msg(data.msg, { icon: 2, time: 1000 });
                            }
                        },
                        complete: function () {
                            layer.closeAll();
                            layer.close(this.layerIndex);
                        },
                    });
                });
            }
        });
    });
</script>
