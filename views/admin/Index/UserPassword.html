<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
        <div class="layui-form layuimini-form">
            <div class="layui-form-item">
                <label class="layui-form-label required">旧的密码</label>
                <div class="layui-input-block" style="width: 500px;">
                    <input type="password" name="old_password" lay-verify="required" lay-reqtext="旧的密码不能为空" placeholder="请输入旧的密码" value="" class="layui-input">
                    <tip>填写自己账号的旧的密码。</tip>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required">新的密码</label>
                <div class="layui-input-block" style="width: 500px;">
                    <input type="password" name="new_password" lay-verify="required|password" lay-reqtext="新的密码不能为空" placeholder="请输入新的密码" value="" class="layui-input">
                    <tip>提示：密码为8-16位，必须包含数字、英文字母、特殊符号，特殊符号包括: ~!@#$%^&*。</tip>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required">确认密码</label>
                <div class="layui-input-block" style="width: 500px;">
                    <input type="password" name="again_password" lay-verify="required|repassword" lay-reqtext="新的密码不能为空" placeholder="请输入新的密码" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn layui-btn-normal" id="btnSubmit">确认保存</button>
                </div>
            </div>
        </div>
    </form>
</div>
<script>
    layui.use('form', function () {
        var form = layui.form;
        // 定义校验规则
        form.verify({
            password: function (value, item) {
                if (!/^[\da-zA-Z~!@#$%^&*]{8,16}$/.test(value)) {
                    return '密码必须为8-16位，包含数字、英文字母、特殊符号(~!@#$%^&*)';
                }
            },
            repassword: function (value, item) {
                var password = $('input[name=new_password]').val(); // 获取输入密码
                if (value != password) {
                    $('input[name=again_password]').focus()
                    return '两次输入的密码不一致';
                }
            }
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            console.log(data)
            // alert(JSON.stringify(data.field));
            return false;
        });

        $('#btnSubmit').on('click', function () {
            form.submit('frmEdit', function (data) {
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/index/UserPasswordSave", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        console.log(data);
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
