<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">站点名称</label>
                            <div class="layui-input-inline">
                                <input type="text" maxlength="50" id="title" name="title" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">网站名称</label>
                            <div class="layui-input-inline">
                                <input type="text" maxlength="50" id="name" name="name" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter"></table>
    </div>
</div>
{{template "admin/Public/Button.html" }}
<script>
    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        table.render({
            elem: '#currentTableId',
            url: '/admin/site/data',
            toolbar: '#toolbarDemo',
            height: "full-170",
            defaultToolbar: ['filter', 'exports', 'print', {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            cols: [[
                // { type: "checkbox", width: 50 },
                { field: 'site_id', width: 80, title: 'ID', sort: true },
                { field: 'title', title: '站点名称' },
                { field: 'dir_path', width: 180, title: '生成目录名' },
                { field: 'name', title: '网站名称', sort: true },
                { field: 'crod', title: '网站备案号', sort: true },
                {
                    field: 'is_mobile', width: 120, title: '移动站', sort: true, templet: function (d) {
                        return d.is_mobile ? "×" : "√";
                    }
                },
                {
                    field: 'is_default', width: 120, title: '默认', sort: true, templet: function (d) {
                        return d.is_default ? "×" : "√";
                    }
                },
                {
                    field: 'logo', title: '网站LOGO', width: 150, templet: function (d) {
                        if (d.logo != "") {
                            return '<img src="' + d.logo + '" style="max-width: 100px;max-height: 100px;" />';
                        }
                        return "";
                    }
                },
                {
                    field: 'sort_id', width: 120, align: "center", title: '排序', templet: function (d) {
                        return '<input type="number" name="sort_id" site_id="' + d.site_id + '" value="' + d.sort_id + '" class="layui-input" style="" />';
                    }
                },
                { title: '操作', width: 150, toolbar: '#currentTableBar', align: "center" }
            ]],
            limits: [10, 15, 20],
            limit: 20,
            page: true,
            // skin: 'line',
            even: true,
            size: 'lg',
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            //执行搜索重载
            table.reload('currentTableId', {
                page: {
                    curr: 1
                },
                where: { "name": data.field.name, "title": data.field.title, "domain": data.field.domain }
            }, 'data');

            return false;
        });

        /**
         * toolbar监听事件
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'add') {  // 监听添加操作
                var index = layer.open({
                    title: '添加站点',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: '/admin/site/edit',
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            } else if (obj.event === 'save') {  // 监听保存操作
                var sorts = [];
                $("input[name='sort_id']").each(function () {
                    var sort = {
                        site_id: parseInt($(this).attr("site_id")),
                        sort_id: parseInt($(this).val())
                    };
                    sorts.push(sort);
                });
                console.log(sorts);
                // return false;
                $.ajax({
                    type: "POST",
                    url: "/admin/site/SiteSaveSortId", //提交的地址
                    data: JSON.stringify(sorts),
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        if (data.code == CodeSuccess) {
                            layer.msg("保存排序成功", { icon: 1, time: 1000 }, function () {
                                $('button[lay-filter="data-search-btn"]').click();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            } else if (obj.event === 'delete') {  // 监听删除操作
                var checkStatus = table.checkStatus('currentTableId')
                    , data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要删除的数据");
                    return;
                }
                var ids = []
                for (i = 0; i < data.length; i++) {
                    ids.push(data[i].site_id)
                }
                index = layer.confirm('确定要删除数据吗?', function (index) {
                    $.get("/admin/site/delete", { "ids": ids.join(",") }, function (data) {
                        if (data.code == 0) {
                            layer.close(index);
                            //执行搜索重载
                            table.reload('currentTableId', {
                                page: {
                                    curr: 1
                                },
                                where: {
                                    "name": $("#name").val(),
                                    "title": $("#title").val(),
                                }
                            }, 'data');
                        }
                    })
                });
            }
        });

        //监听表格复选框选择
        table.on('checkbox(currentTableFilter)', function (obj) {
            console.log(obj)
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                editUrl = "/admin/site/edit?id=" + data.site_id
                var index = layer.open({
                    title: '编辑站点',
                    content: editUrl,
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%']
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else if (obj.event === 'delete') {
                index = layer.confirm('确定要删除数据吗?', function (index) {
                    $.get("/admin/site/delete", { "ids": data.site_id }, function (data) {
                        if (data.code == 0) {
                            layer.close(index);
                            table.reload('currentTableId', {
                                page: {
                                    curr: 1
                                }
                                ,
                                where: {
                                    "name": $("#name").val(),
                                    "title": $("#title").val(),
                                }
                            }, 'data');
                        }
                    })
                });
            }
        });

    });
</script>
