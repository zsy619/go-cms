<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">网站名称</label>
                            <div class="layui-input-inline">
                                <input type="text" maxlength="50" id="name" name="name" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">站点名称</label>
                            <div class="layui-input-inline">
                                <input type="text" maxlength="50" id="title" name="title" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">绑定域名</label>
                            <div class="layui-input-inline">
                                <input type="text" maxlength="50" id="domain" name="domain" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add"> 添加 </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete"> 删除 </button>
            </div>
        </script>
        <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter"></table>
        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit">编辑</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete" lay-event="delete">删除</a>
        </script>
    </div>
</div>
<script>
    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        table.render({
            elem: '#currentTableId',
            url: '/admin/site/data',
            toolbar: '#toolbarDemo',
            height: "full-170",
            defaultToolbar: ['filter', 'exports', 'print', {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            cols: [[
                { type: "checkbox", width: 50 },
                { field: 'site_id', width: 80, title: 'ID', sort: true },
                { field: 'dir_path', width: 180, title: '目录名' },
                { field: 'title', width: 180, title: '站点名称', sort: true },
                { field: 'domain', width: 280, title: '绑定域名' },
                { field: 'sort_id', title: '排序', minWidth: 150 },
                { field: 'mobile', width: 180, title: '移动站', sort: true,templet:function(d){
                    if(d.mobile == 0){
                        return "否"
                    }else if(d.mobile == 1){
                        return "是"
                    }
                    return ""
                }},
                { field: 'is_default', width: 180, title: '是否默认', sort: true,templet:function(d){
                    if(d.is_default == 0){
                        return "否"
                    }else if(d.is_default == 1){
                        return "是"
                    }
                    return ""
                }},
                { title: '操作', minWidth: 150, toolbar: '#currentTableBar', align: "center" }
            ]],
            limits: [10, 15, 20],
            limit: 15,
            page: true,
            skin: 'line'
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            //执行搜索重载
            table.reload('currentTableId', {
                page: {
                    curr: 1
                },
                where: {"name":data.field.name,"title":data.field.title,"domain":data.field.domain}
            }, 'data');

            return false;
        });

        /**
         * toolbar监听事件
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'add') {  // 监听添加操作
                var index = layer.open({
                    title: '添加用户',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: '/admin/site/edit',
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            } else if (obj.event === 'delete') {  // 监听删除操作
                var checkStatus = table.checkStatus('currentTableId')
                    , data = checkStatus.data;
                if(data.length == 0){
                    layer.msg("请选择要删除的数据");
                    return;
                }
                var ids = []
                for(i=0;i<data.length;i++){
                    ids.push(data[i].site_id)
                }
                index = layer.confirm('确定要删除数据吗?', function (index) {
                    $.get("/admin/site/delete",{"ids":ids.join(",")},function(data){
                        if(data.code == 0) {
                            layer.close(index);
                            //执行搜索重载
                            table.reload('currentTableId', {
                                page: {
                                    curr: 1
                                },
                                where: {
                                    "name": $("#name").val(),
                                    "title": $("#title").val(),
                                    "domain": $("#domain").val()
                                }
                            }, 'data');
                        }
                    })
                });
            }
        });

        //监听表格复选框选择
        table.on('checkbox(currentTableFilter)', function (obj) {
            console.log(obj)
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                editUrl = "/admin/site/edit?id="+data.site_id
                var index = layer.open({
                    title: '编辑站点',
                    content:editUrl,
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%']
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else if (obj.event === 'delete') {
                index = layer.confirm('确定要删除数据吗?', function (index) {
                    $.get("/admin/site/delete",{"ids":data.site_id},function(data){
                        if(data.code == 0) {
                            layer.close(index);
                            table.reload('currentTableId', {
                                page: {
                                    curr: 1
                                }
                                ,
                                where: {
                                    "name": $("#name").val(),
                                    "title": $("#title").val(),
                                    "domain": $("#domain").val()
                                }
                            }, 'data');
                        }
                    })
                });
            }
        });

    });
</script>
