<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
        <div class="layui-tab layui-tab-brief layui-tab-card">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            频道名称
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="hidden" name="channel_id" value="{{.mdl.ChannelID}}">
                            <input type="hidden" name="parent_id" value="{{.mdl.ParentID}}">
                            <input type="hidden" name="site_id" value="{{.mdl.SiteID}}">
                            <input type="text" name="name" value="{{.mdl.Name}}" lay-verify="required|name" lay-reqtext="频道名称为必填项" autocomplete="off" placeholder="请输入频道名称" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">频道名称，只允许使用英文、数字或下划线。</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            频道标题
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="title" value="{{.mdl.Title}}" lay-verify="required" lay-reqtext="频道标题为必填项" autocomplete="off" placeholder="请输入频道标题" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">标题备注，允许中文。</div>
                    </div>
                    <div class="layui-form-item" style="display: none;">
                        <label class="layui-form-label">频道类型</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="kind" value="0" title="文章" {{if eq .mdl.Kind 0}} checked="" {{end}}>
                            <input type="radio" name="kind" value="1" title="链接" {{if eq .mdl.Kind 1}} checked="" {{end}}>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">图片地址</label>
                        <div class="layui-input-inline layuimini-upload" style="width: 325px;">
                            <input type="hidden" name="img_url2" value="{{.mdl.ImgUrl2}}">
                            <input type="text" name="img_url1" value="{{.mdl.ImgUrl1}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <button type="button" class="layui-btn layui-btn-primary" style="margin-left: -10px;" id="btnUpload">
                            <i class="layui-icon layui-icon-upload"></i>上传
                        </button>
                        <button type="button" class="layui-btn layui-btn-normal" id="btnSelect">
                            <i class="layui-icon layui-icon-list"></i>选择
                        </button>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">开启评论</label>
                        <div class="layui-input-inline" style="width: 100px;">
                            <input name="is_comment" type="checkbox" value="1" title="是" {{if eq .mdl.IsComment 1}} checked="" {{end}}>
                        </div>
                        <div class="layui-form-mid layui-word-aux">开启评论功能后可允许对内容进行评论</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">开启相册</label>
                        <div class="layui-input-inline" style="width: 100px;">
                            <input name="is_album" type="checkbox" value="1" title="是" {{if eq .mdl.IsAlbum 1}} checked="" {{end}}>
                        </div>
                        <div class="layui-form-mid layui-word-aux">开启相册功能后可上传多张图片</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">开启附件</label>
                        <div class="layui-input-inline" style="width: 100px;">
                            <input name="is_attach" type="checkbox" value="1" title="是" {{if eq .mdl.IsAttach 1}} checked="" {{end}}>
                        </div>
                        <div class="layui-form-mid layui-word-aux">开启附件功能后可上传多个附件</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">开启规格</label>
                        <div class="layui-input-inline" style="width: 100px;">
                            <input name="is_spec" type="checkbox" value="1" title="是" {{if eq .mdl.IsSpec 1}} checked="" {{end}}>
                        </div>
                        <div class="layui-form-mid layui-word-aux">开启规格需选中市场价、销售价、库存三个扩展字段</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">排序号</label>
                        <div class="layui-input-inline" style="width: 80px;">
                            <input type="number" name="sort_id" lay-verify="number" value="{{.mdl.SortID}}" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">数字，越小越向前</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;">
                <button class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
            </div>
        </div>
    </form>
</div>
<script>
    layui.use(['form', 'layer', 'wangEditor', 'tableSelect', 'upload'], function () {
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer,
            tableSelect = layui.tableSelect,
            wangEditor = layui.wangEditor;
        var upload = layui.upload;

        tableSelect.render({
            elem: '#btnSelect',
            checkedKey: 'id',
            height: '340',
            width: '800',
            searchType: 'more',
            searchList: [
                { searchKey: 'title', searchPlaceholder: '文件' },
                { searchKey: 'ext', searchPlaceholder: '后缀' },
            ],
            table: {
                url: '/admin/common/AlbumSearch',
                response: {
                    statusCode: 0,
                },
                cols: [[
                    { type: 'radio' },
                    { field: 'album_id', width: 80, title: 'ID', sort: true },
                    {
                        field: 'original_path', title: '图片信息', templet: function (d) {
                            return '<img src=' + d.original_path + '>';
                        }
                    },
                    { field: 'title', title: '名称' },
                    { field: 'file_ext', title: '文件后缀' },
                    { field: 'file_size', title: '文件大小' },
                    { field: 'table_name', title: '来源', width: 80 },
                    { field: 'remark', title: '描述', },
                ]]
            },
            done: function (elem, data) {
                layui.each(data.data, function (index, item) {
                    $("input[name='img_url1']").val(item.original_path);
                    $("input[name='img_url2']").val(item.file_path);
                })
            }
        })

        //执行实例
        var uploadInst = upload.render({
            elem: '#btnUpload' //绑定元素
            , url: '/admin/tools/ImageUpload?path=site' //上传接口
            , done: function (res) {
                //上传完毕回调
                if (res.code == 0) {
                    $("input[name='img_url1']").val(res.file.url1);
                    $("input[name='img_url2']").val(res.file.url2);
                } else {
                    layer.msg(res.msg);
                }
            }
            , error: function () {
                //请求异常回调
            }
        });

        //自定义验证规则
        form.verify({
            name: [/^[a-zA-Z0-9\-\_]{2,50}$/, '请填写正确的频道名称']
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            return false;
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            form.submit('frmEdit', function (data) {
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/site/ChannelSave", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        console.log(data);
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
