<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-inline">
                        <label class="layui-form-label">语言名称</label>
                        <div class="layui-input-inline">
                            <input type="text" name="name" id="name" placeholder="请输入语言名称" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">语言代码</label>
                        <div class="layui-input-inline">
                            <input type="text" name="code" id="code" placeholder="如: zh-CN, en" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn layui-btn-primary layui-btn-radius" lay-submit type="button" id="btnSearch">
                            <i class="layui-icon layui-icon-search"></i> 搜索
                        </button>
                        <button class="layui-btn layui-btn-normal" type="button" id="btnAdd">
                            <i class="layui-icon layui-icon-add-1"></i> 添加语言
                        </button>
                    </div>
                    <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" style="float:right;margin-right:20px;" id="btnInit">
                        <i class="layui-icon layui-icon-refresh"></i> 初始化数据
                    </button>
                </form>
            </div>
        </fieldset>
        <table id="table" class="layui-table" lay-filter="table"></table>
    </div>
</div>
<script type="text/html" id="actionBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>
<script>
    layui.use(['table', 'layer', 'form'], function () {
        var table = layui.table;
        var layer = layui.layer;
        var form = layui.form;

        // 渲染表格（不分页）
        var tableIns = table.render({
            elem: '#table',
            url: '/admin/site/language/data',
            page: false,
            height: 'full-180',
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                { field: 'language_id', title: 'ID', width: 80, sort: true },
                { field: 'icon', title: '图标', width: 80, templet: function (d) { return d.icon || '-'; } },
                { field: 'name', title: '语言名称', width: 150 },
                { field: 'code', title: '代码', width: 120 },
                { field: 'description', title: '描述' },
                { field: 'sort_id', title: '排序', width: 80, sort: true },
                {
                    field: 'status', title: '状态', width: 100, templet: function (d) {
                        if (d.status == 1) {
                            return '<span class="layui-badge layui-bg-green">启用</span>';
                        } else {
                            return '<span class="layui-badge layui-bg-gray">禁用</span>';
                        }
                    }
                },
                {
                    field: 'is_default', title: '默认', width: 80, templet: function (d) {
                        if (d.is_default) {
                            return '<span class="layui-badge layui-bg-green">是</span>';
                        } else {
                            return '否';
                        }
                    }
                },
                { fixed: 'right', title: '操作', width: 150, toolbar: '#actionBar' }
            ]]
        });

        // 搜索
        $('#btnSearch').on('click', function () {
            tableIns.reload({
                page: false,
                where: {
                    name: $('#name').val(),
                    code: $('#code').val()
                }
            });
        });

        // 初始化数据
        $('#btnInit').on('click', function () {
            layer.confirm('确定要初始化语言数据吗？', function (index) {
                $.get('/admin/site/language/init', function (res) {
                    if (res.code == CodeSuccess) {
                        layer.msg('初始化成功', function () {
                            tableIns.reload({
                                page: false,
                                where: {
                                    name: $('#name').val(),
                                    code: $('#code').val()
                                }
                            });
                        });
                    } else {
                        layer.msg(res.msg || '初始化失败');
                    }
                });
                layer.close(index);
            });
        });

        // 添加
        $('#btnAdd').on('click', function () {
            layer.open({
                type: 2,
                title: '添加语言',
                area: ['600px', '500px'],
                content: '/admin/site/language/edit?id=0',
                end: function () {
                    tableIns.reload({
                        page: false,
                        where: {
                            name: $('#name').val(),
                            code: $('#code').val()
                        }
                    });
                }
            });
        });

        // 监听工具条
        table.on('tool(table)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                layer.open({
                    type: 2,
                    title: '编辑语言',
                    area: ['600px', '500px'],
                    content: '/admin/site/language/edit?id=' + data.language_id,
                    end: function () {
                        tableIns.reload({
                            page: false,
                            where: {
                                name: $('#name').val(),
                                code: $('#code').val()
                            }
                        });
                    }
                });
            } else if (obj.event === 'del') {
                layer.confirm('确定删除该语言吗？', function (index) {
                    $.get('/admin/site/language/delete', { ids: data.language_id }, function (res) {
                        if (res.code == CodeSuccess) {
                            layer.msg('删除成功');
                            tableIns.reload({
                                page: false,
                                where: {
                                    name: $('#name').val(),
                                    code: $('#code').val()
                                }
                            });
                        } else {
                            layer.msg(res.msg || '删除失败');
                        }
                    });
                    layer.close(index);
                });
            }
        });
    });
</script>
