<div class="layuimini-main">
	<form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
		<div class="layui-tab layui-tab-brief layui-tab-card">
			<ul class="layui-tab-title">
				<li class="layui-this">基本信息</li>
				<li>详细描述</li>
			</ul>
			<div class="layui-tab-content">
				<div class="layui-tab-item layui-show">
					<div class="layui-form-item">
						<label class="layui-form-label required">
							内容标题
						</label>
						<div class="layui-input-inline" style="width: 500px;">
							<input type="hidden" name="notice_id" value="{{.mdl.NoticeID}}">
							<input type="text" name="title" value="{{.mdl.Title}}" maxlength="256" lay-verify="required" lay-reqtext="内容标题为必填项" autocomplete="off" placeholder="" class="layui-input">
						</div>
						<div class="layui-form-mid layui-word-aux">标题最多256个字符</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">副标题</label>
						<div class="layui-input-inline" style="width: 500px;">
							<input type="text" name="sub_title" value="{{.mdl.SubTitle}}" maxlength="128" autocomplete="off" placeholder="" class="layui-input">
						</div>
						<div class="layui-form-mid layui-word-aux">标题最多128个字符</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">选项</label>
						<div class="layui-input-inline" style="width: 500px;">
							<input name="is_top" type="checkbox" value="1" title="置顶" {{if eq .mdl.IsTop 1}} checked="" {{end}}>
						</div>
					</div>
					{{if .roleMap.IsHasAudit}}
					<div class="layui-form-item">
						<label class="layui-form-label">状&nbsp;&nbsp;态</label>
						<div class="layui-input-inline" style="width: 500px;">
							<input type="radio" name="status" value="0" title="草稿" {{if eq .mdl.Status 0}}checked="checked" {{end}}>
							<input type="radio" name="status" value="2" title="通过" {{if eq .mdl.Status 2}}checked="checked" {{end}}>
							<input type="radio" name="status" value="3" title="拒绝" {{if eq .mdl.Status 3}}checked="checked" {{end}}>
							<input type="radio" name="status" value="4" title="驳回" {{if eq .mdl.Status 4}}checked="checked" {{end}}>
						</div>
					</div>
					{{end}}
					<div class="layui-form-item">
						<label class="layui-form-label">发布者</label>
						<div class="layui-input-inline" style="width: 500px;">
							<input type="text" name="create_name" value="{{.mdl.CreateName}}" autocomplete="off" placeholder="" class="layui-input">
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">排序号</label>
						<div class="layui-input-inline" style="width: 80px;">
							<input type="number" name="sort_id" lay-verify="number" value="{{.mdl.SortID}}" class="layui-input">
						</div>
						<div class="layui-form-mid layui-word-aux">数字，越小越向前</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">发布时间</label>
						<div class="layui-input-inline" style="width: 500px;">
							<input type="text" id="publish_time" name="publish_time" lay-verify="datetime" value='{{dateformat .mdl.PublishTime "2006-01-02 15:04:05"}}' class="layui-input">
						</div>
					</div>
				</div>
				<div class="layui-tab-item">
					<div class="layui-form-item">
						<label class="layui-form-label required">
							内容描述
						</label>
						<div class="layui-input-inline" style="width: 750px;">
							<textarea id="myEditor" name="content" type="text/plain" style="width: 100%;height: 500px;display: none;">{{.mdl.Content}}</textarea>
							<script id="editor" type="text/plain" style="height:500px;width: 100%;">{{str2html .mdl.Content}}</script>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="layui-form-item">
			<div class="layui-input-block" style="text-align: center;">
				<button type="button" class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
				<button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
			</div>
		</div>
	</form>
</div>
<!-- <script type="text/javascript" src="/static/admin/lib/ueditor-plus-v3.0.0/map.js"></script> -->
<script>
	layui.use(['form', 'layer', 'wangEditor', 'laydate'], function () {
		var form = layui.form;
		var $ = layui.jquery,
			layer = layui.layer,
			wangEditor = layui.wangEditor;
		var laydate = layui.laydate;

		var ue = UE.getEditor('editor', {
			autoHeight: false
		});
		ue.ready(function () {
			ue.setHeight(500);
			ue.execCommand('fontfamily', '仿宋'); //字体
			ue.execCommand('lineheight', 2); //行间距
			ue.execCommand('fontsize', '16px'); //字号
		});

		laydate.render({
			elem: '#publish_time', type: 'datetime'
		});

		// 提交事件
		form.on('submit(*)', function (data) {
			return false;
		});

		//方法提交
		$('#btnSubmit').on('click', function () {
			ue.sync();
			$("#myEditor").val(ue.getContent());
			form.submit('frmEdit', function (data) {
				data.field.content = UE.getEditor('editor').getContent();
				$.ajax({
					type: "POST", //提交的方法
					url: "/admin/notice/NoticeSave", //提交的地址
					data: $('#frmEdit').serialize(), // 序列化表单值
					async: false,
					beforeSend: function () { //当一个Ajax请求开始时触发
						this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
					},
					error: function (request) {  //失败的话
					},
					success: function (data) {  //成功
						layer.closeAll();
						if (data.code == CodeSuccess) {
							layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
								var index = parent.layer.getFrameIndex(window.name);
								parent.layer.close(index);
								parent.$("#btnSearch").click();
							});
						} else {
							layer.msg(data.msg, { icon: 2, time: 1000 });
						}
					},
					complete: function () {
						layer.close(this.layerIndex);
					},
				});
			});
			return false;
		});

	});
</script>
