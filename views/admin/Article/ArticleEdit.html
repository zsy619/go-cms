<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit" enctype="multipart/form-data">
        <div class="layui-tab layui-tab-brief layui-tab-card">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
                <li>详细描述</li>
                <li>SEO选项</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            所属类别
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="hidden" name="article_id" value="{{.mdl.ArticleID}}">
                            <input type="hidden" name="channel_id" value="{{.mdl.ChannelID}}">
                            <input type="hidden" name="category_id" value="{{.mdl.CategoryID}}">
                            <input type="text" name="tree" id="tree" lay-filter="tree" autocomplete="off" lay-verify="required" lay-reqtext="选择栏目类别" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            内容标题
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="title" value="{{.mdl.Title}}" maxlength="256" lay-verify="required" lay-reqtext="内容标题为必填项" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">标题最多256个字符</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">副标题</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="sub_title" value="{{.mdl.SubTitle}}" maxlength="128" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">标题最多128个字符</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">标题图标</label>
                        <div class="layui-input-inline" style="width: 325px;">
                            <input type="hidden" name="ico_url2" value="{{.mdl.IcoUrl2}}">
                            <input type="text" name="ico_url1" value="{{.mdl.IcoUrl1}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <button type="button" class="layui-btn layui-btn-primary" style="margin-left: -10px;" id="btnUploadIco">
                            <i class="layui-icon layui-icon-upload"></i>上传
                        </button>
                        <button type="button" class="layui-btn layui-btn-primary" id="btnSelectIco">
                            <i class="layui-icon layui-icon-list"></i>选择
                        </button>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">Tags标签</label>
                        <div class="layui-input-inline" style="width: 415px;">
                            <input type="text" name="tags" value="{{.mdl.Tags}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <button type="button" class="layui-btn layui-btn-primary" style="margin-left: -10px;" id="btnSelectTag">
                            <i class="layui-icon layui-icon-list"></i>选择
                        </button>
                        <br>
                        <div style="margin-left: 120px;" class="layui-form-mid layui-word-aux">多个可用英文逗号分隔开，如：a,b</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">专题</label>
                        <div class="layui-input-inline" style="width: 415px;">
                            <input type="text" name="topic" value="{{.mdl.Topic}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <button type="button" class="layui-btn layui-btn-primary" style="margin-left: -10px;" id="btnSelectTopic">
                            <i class="layui-icon layui-icon-list"></i>选择
                        </button>
                        <br>
                        <div style="margin-left: 120px;" class="layui-form-mid layui-word-aux">多个可用英文逗号分隔开，如：a,b</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">选项</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input name="is_comment" type="checkbox" value="1" title="评论" {{if eq .mdl.IsComment 1}} checked="" {{end}}>
                            <input name="is_top" type="checkbox" value="1" title="置顶" {{if eq .mdl.IsTop 1}} checked="" {{end}}>
                            <input name="is_red" type="checkbox" value="1" title="推荐" {{if eq .mdl.IsRed 1}} checked="" {{end}}>
                            <input name="is_hot" type="checkbox" value="1" title="热门" {{if eq .mdl.IsHot 1}} checked="" {{end}}>
                            <input name="is_slide" type="checkbox" value="1" title="幻灯片" {{if eq .mdl.IsSlide 1}} checked="" {{end}}>
                        </div>
                    </div>
                    {{if .roleMap.IsHasAudit}}
                    <div class="layui-form-item" >
                        <label class="layui-form-label">状&nbsp;&nbsp;态</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="status" value="0" title="草稿" {{if eq .mdl.Status 0}}checked="checked" {{end}}>
                            <input type="radio" name="status" value="2" title="通过" {{if eq .mdl.Status 2}}checked="checked" {{end}}>
                            <input type="radio" name="status" value="3" title="拒绝" {{if eq .mdl.Status 3}}checked="checked" {{end}}>
                        </div>
                    </div>
                    {{end}}
                    <div class="layui-form-item">
                        <label class="layui-form-label">来&nbsp;&nbsp;源</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="source" value="{{.mdl.Source}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">作&nbsp;&nbsp;者</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="author" value="{{.mdl.Author}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">封面图片</label>
                        <div class="layui-input-inline" style="width: 325px;">
                            <input type="hidden" name="img_url2" value="{{.mdl.ImgUrl2}}">
                            <input type="text" name="img_url1" value="{{.mdl.ImgUrl1}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <button type="button" class="layui-btn layui-btn-primary" style="margin-left: -10px;" id="btnUpload">
                            <i class="layui-icon layui-icon-upload"></i>上传
                        </button>
                        <button type="button" class="layui-btn layui-btn-primary" id="btnSelect">
                            <i class="layui-icon layui-icon-list"></i>选择
                        </button>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">排序号</label>
                        <div class="layui-input-inline" style="width: 80px;">
                            <input type="number" name="sort_id" lay-verify="number" value="{{.mdl.SortID}}" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">数字，越小越向前</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">浏览次数</label>
                        <div class="layui-input-inline" style="width: 80px;">
                            <input type="number" min="0" name="click" lay-verify="number" value="{{.mdl.Click}}" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">点击浏览该信息自动+1</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">点赞总数</label>
                        <div class="layui-input-inline" style="width: 80px;">
                            <input type="number" min="0" name="like_count" lay-verify="number" value="{{.mdl.LikeCount}}" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">发布时间</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" id="publish_time" name="publish_time" lay-verify="datetime" value='{{dateformat .mdl.PublishTime "2006-01-02 15:04:05"}}' class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">调用别名</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="call_index" value="{{.mdl.CallIndex}}" lay-verify="call_index" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">别名访问，非必填，不可重复；只允许使用英文、数字或下划线</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">模板路径</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="template" value="{{.mdl.Template}}" lay-verify="template" lay-reqtext="模板路径不正确" autocomplete="off" placeholder="请输入模板路径" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">利用独立模板控制显示</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">URL链接</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="link_url" value="{{.mdl.LinkURL}}" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">填写后直接跳转到该网址</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">内容摘要</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <textarea name="summary" placeholder="" class="layui-textarea">{{.mdl.Summary}}</textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">不填写则自动截取内容前255字符</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            内容描述
                        </label>
                        <div class="layui-input-inline" style="width: 750px;">
                            <textarea id="myEditor" name="content" type="text/plain" style="width: 100%;height: 500px;display: none;">{{.mdl.Content}}</textarea>
                            <script id="editor" type="text/plain" style="height:500px;width: 100%;">{{str2html .mdl.Content}}</script>
                        </div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">SEO标题</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" value="{{.mdl.SeoTitle}}" name="seo_title" autocomplete="off" placeholder="请输入SEO标题" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">SEO关健字</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <textarea name="seo_keyword" placeholder="请输入SEO关健字" class="layui-textarea">{{.mdl.SeoKeyword}}</textarea>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">SEO描述</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <textarea name="seo_description" placeholder="请输入SEO描述" class="layui-textarea">{{.mdl.SeoDescription}}</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;">
                <button type="button" class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="/static/admin/lib/ueditor-plus-v3.0.0/map.js"></script>

    layui.use(['form', 'layer', 'wangEditor', 'upload', 'laydate', 'tableSelect', 'treeSelect'], function () {
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer,
            tableSelect = layui.tableSelect,
            wangEditor = layui.wangEditor;
        var upload = layui.upload;
        var laydate = layui.laydate;
        var treeSelect = layui.treeSelect;

        tableSelect.render({
            elem: '#btnSelectTopic',
            checkedKey: 'id',
            height: '340',
            width: '800',
            searchType: 'more',
            searchList: [
                { searchKey: 'name', searchPlaceholder: '名称' },
                { searchKey: 'title', searchPlaceholder: '标题' },
            ],
            table: {
                url: '/admin/topic/topicpaginate?status=2',
                response: {
                    statusCode: 0,
                },
                cols: [[
                    { type: "checkbox", width: 50 },
                    { field: 'topic_id', width: 80, title: 'ID', sort: true },
                    { field: 'name', title: '名称', sort: true },
                    { field: 'title', title: '标题' },
                    {
                        field: 'template', title: '模板路径'
                    },
                    {
                        field: 'img_url1', title: '图片', width: 150, templet: function (d) {
                            if (d.img_url1 != "") {
                                return '<img src="' + d.img_url1 + '" style="max-width: 100px;max-height: 100px;" />';
                            }
                            return "";
                        }
                    },
                    { field: 'remark', title: '描述', },
                ]]
            },
            done: function (elem, data) {
                layui.each(data.data, function (index, item) {
                    var tag = $("input[name='topic']").val();
                    if (tag == "") {
                        tag = item.name;
                    } else {
                        tag = tag + "," + item.name;
                    }
                    $("input[name='topic']").val(tag);
                })
            }
        })

        tableSelect.render({
            elem: '#btnSelectTag',
            checkedKey: 'id',
            height: '340',
            width: '800',
            searchType: 'more',
            searchList: [
                { searchKey: 'name', searchPlaceholder: '名称' },
                { searchKey: 'title', searchPlaceholder: '标题' },
            ],
            table: {
                url: '/admin/tag/tagpaginate?status=2',
                response: {
                    statusCode: 0,
                },
                cols: [[
                    { type: "checkbox", width: 50 },
                    { field: 'tag_id', width: 80, title: 'ID', sort: true },
                    { field: 'name', title: '名称', sort: true },
                    { field: 'title', title: '标题' },
                    {
                        field: 'img_url1', title: '图片', width: 150, templet: function (d) {
                            if (d.img_url1 != "") {
                                return '<img src="' + d.img_url1 + '" style="max-width: 100px;max-height: 100px;" />';
                            }
                            return "";
                        }
                    },
                    { field: 'remark', title: '描述', },
                ]]
            },
            done: function (elem, data) {
                layui.each(data.data, function (index, item) {
                    var tag = $("input[name='tags']").val();
                    if (tag == "") {
                        tag = item.name;
                    } else {
                        tag = tag + "," + item.name;
                    }
                    $("input[name='tags']").val(tag);
                })
            }
        })

        tableSelect.render({
            elem: '#btnSelectIco',
            checkedKey: 'id',
            height: '340',
            width: '800',
            searchType: 'more',
            searchList: [
                { searchKey: 'title', searchPlaceholder: '文件' },
                { searchKey: 'ext', searchPlaceholder: '后缀' },
            ],
            table: {
                url: '/admin/common/AlbumSearch',
                response: {
                    statusCode: 0,
                },
                cols: [[
                    { type: 'radio' },
                    { field: 'album_id', width: 80, title: 'ID', sort: true },
                    {
                        field: 'original_path', title: '图片信息', templet: function (d) {
                            return '<img src=' + d.original_path + '>';
                        }
                    },
                    { field: 'title', title: '名称' },
                    { field: 'file_ext', title: '文件后缀' },
                    { field: 'file_size', title: '文件大小' },
                    { field: 'table_name', title: '来源', width: 80 },
                    { field: 'remark', title: '描述', },
                ]]
            },
            done: function (elem, data) {
                layui.each(data.data, function (index, item) {
                    $("input[name='ico_url1']").val(item.original_path);
                    $("input[name='ico_url2']").val(item.file_path);
                })
            }
        })

        tableSelect.render({
            elem: '#btnSelect',
            checkedKey: 'id',
            height: '340',
            width: '800',
            searchType: 'more',
            searchList: [
                { searchKey: 'title', searchPlaceholder: '文件' },
                { searchKey: 'ext', searchPlaceholder: '后缀' },
            ],
            table: {
                url: '/admin/common/AlbumSearch',
                response: {
                    statusCode: 0,
                },
                cols: [[
                    { type: 'radio' },
                    { field: 'album_id', width: 80, title: 'ID', sort: true },
                    {
                        field: 'original_path', title: '图片信息', templet: function (d) {
                            return '<img src=' + d.original_path + '>';
                        }
                    },
                    { field: 'title', title: '名称' },
                    { field: 'file_ext', title: '文件后缀' },
                    { field: 'file_size', title: '文件大小' },
                    { field: 'table_name', title: '来源', width: 80 },
                    { field: 'remark', title: '描述', },
                ]]
            },
            done: function (elem, data) {
                layui.each(data.data, function (index, item) {
                    $("input[name='img_url1']").val(item.original_path);
                    $("input[name='img_url2']").val(item.file_path);
                })
            }
        })

        var ue = UE.getEditor('editor', {
            autoHeight: false
        });
        ue.ready(function () {
            ue.setHeight(500);
            ue.execCommand('fontfamily', '仿宋'); //字体
            ue.execCommand('lineheight', 2); //行间距
            ue.execCommand('fontsize', '16px'); //字号
        });

        treeSelect.render({
            elem: '#tree',
            data: '/admin/article/CategoryTree?channelId={{.mdl.ChannelID}}&categoryId={{.mdl.CategoryID}}',
            type: 'POST',
            placeholder: '栏目类别',
            search: true,
            style: {
                line: {
                    enable: true
                }
            },
            click: function (d) {
                $("input[name='category_id']").val(d.current.id);
            },
            success: function (d) {
                var categoryId = parseInt($("input[name='category_id']").val());
                if (categoryId != 0) {
                    treeSelect.checkNode('tree', categoryId);
                    treeSelect.refresh('tree');
                }
            }
        });

        laydate.render({
            elem: '#publish_time', type: 'datetime'
        });

        //执行实例
        var uploadInst = upload.render({
            elem: '#btnUpload' //绑定元素
            , url: '/admin/tools/ImageUpload' //上传接口
            , done: function (res) {
                //上传完毕回调
                if (res.code == 0) {
                    $("input[name='img_url1']").val(res.file.url1);
                    $("input[name='img_url2']").val(res.file.url2);
                } else {
                    layer.msg(res.msg);
                }
            }
            , error: function () {
                //请求异常回调
            }
        });

        //执行实例
        var uploadInstIco = upload.render({
            elem: '#btnUploadIco' //绑定元素
            , url: '/admin/tools/ImageUpload?path=ico' //上传接口
            , done: function (res) {
                //上传完毕回调
                if (res.code == 0) {
                    $("input[name='ico_url1']").val(res.file.url1);
                    $("input[name='ico_url2']").val(res.file.url2);
                } else {
                    layer.msg(res.msg);
                }
            }
            , error: function () {
                //请求异常回调
            }
        });

        //自定义验证规则
        form.verify({
            call_index: v_call_index,
            template: function (value, item) {
                var exp = /(.+?)?.html/;
                if (value && !exp.test(value)) {
                    return '模板路径不正确';
                }
            }
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            return false;
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            ue.sync();
            $("#myEditor").val(ue.getContent());
            form.submit('frmEdit', function (data) {
                data.field.content = UE.getEditor('editor').getContent();
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/article/ArticleSave", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                // parent.location.reload();
                                parent.$("#btnSearch").click();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
