<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>添加相册</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">标题</label>
                            <div class="layui-input-inline">
                                <input type="hidden" value="{{.articleId}}" name="article_id" />
                                <input type="hidden" value="1" name="is_show" />
                                <input type="text" name="title" lay-verify="required" lay-reqtext="标题为必填项" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">图片</label>
                            <div class="layui-input-inline">
                                <input type="hidden" value="" name="file_path" />
                                <input type="hidden" value="" name="file_ext" />
                                <input type="hidden" value="0" name="file_size" />
                                <input type="text" name="original_path" lay-verify="required" lay-reqtext="请选择图片" value="" autocomplete="off" placeholder="" class="layui-input">
                            </div>
                            <button type="button" class="layui-btn layui-btn-primary" id="btnUploadIco">
                                <i class="layui-icon">&#xe67c;</i>浏览...
                            </button>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">链接</label>
                            <div class="layui-input-inline">
                                <input type="text" name="link_url" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">备注</label>
                            <div class="layui-input-inline">
                                <input type="text" name="remark" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="button" class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <table class="layui-hide" id="tableContainer" lay-filter="currentTableFilter"></table>
    </div>
</div>
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container layui-btn-group">
        <button class="layui-btn layui-btn-primary layui-btn-sm data-add-btn" lay-event="show"><i class="layui-icon layui-icon-ok"></i>显示</button>
        <button class="layui-btn layui-btn-danger layui-btn-sm data-add-btn" lay-event="hide"><i class="layui-icon layui-icon-close"></i>隐藏</button>
        <button class="layui-btn layui-btn-sm layui-btn-primary data-delete-btn" lay-event="save"><i class="layui-icon layui-icon-ok"></i>保存</button>
    </div>
</script>
<script type="text/html" id="currentTableBar">
    <div class="layui-btn-container layui-btn-group">
        <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete layui-btn-radius" lay-event="delete"><i class="layui-icon layui-icon-close"></i>删除</a>
    </div>
</script>
<script>
    var articleId = parseInt("{{.articleId}}");
    var channelId = parseInt("{{.channelId}}");
    layui.use(['form', 'table', 'layer', 'wangEditor', 'upload', 'treetable'], function () {
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer,
            wangEditor = layui.wangEditor;
        var upload = layui.upload;
        var treetable = layui.treetable;
        var table = layui.table;

        //执行实例
        var uploadInstIco = upload.render({
            elem: '#btnUploadIco' //绑定元素
            , url: '/admin/tools/ImageUpload?path=album' //上传接口
            , done: function (res) {
                //上传完毕回调
                if (res.code == 0) {
                    $("input[name='title']").val(res.file.name1);
                    $("input[name='file_size']").val(res.file.size);
                    $("input[name='file_ext']").val(res.file.ext);
                    $("input[name='original_path']").val(res.file.url1);
                    $("input[name='file_path']").val(res.file.url2);
                } else {
                    layer.msg(res.msg);
                }
            }
            , error: function () {
                //请求异常回调
            }
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            return false;
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            form.submit('frmEdit', function (data) {
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/article/AlbumSave", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });

        table.render({
            elem: '#tableContainer',
            url: '/admin/article/AlbumPaginate?isShow=-1&articleId={{.articleId}}',
            toolbar: '#toolbarDemo',
            height: "full-180",
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                { type: "checkbox", width: 50 },
                { field: 'album_id', width: 80, title: 'ID', sort: true },
                {
                    field: 'title', title: '标题', templet: function (d) {
                        return '<input type="input" name="title" album_id="' + d.album_id + '" value="' + d.title + '" class="layui-input" style="" />';
                    }
                },
                {
                    field: 'link_url', title: '外部链接', templet: function (d) {
                        return '<input type="input" name="link_url" album_id="' + d.album_id + '" value="' + d.link_url + '" class="layui-input" style="" />';
                    }
                },
                {
                    field: 'remark', title: '备注', templet: function (d) {
                        return '<input type="input" name="remark" album_id="' + d.album_id + '" value="' + d.remark + '" class="layui-input" style="" />';
                    }
                },
                {
                    field: 'is_show', title: '显示', width: 100, align: "center", templet: function (d) {
                        return d.is_show == 1 ? '√' : "×";
                    }
                },
                {
                    field: 'original_path', title: '图片', width: 150, templet: function (d) {
                        if (d.original_path != "") {
                            return '<img src="' + d.original_path + '" style="max-width: 100px;max-height: 100px;" />';
                        }
                        return "";
                    }
                },
                {
                    field: 'click', width: 100, align: "center", title: '点击数', templet: function (d) {
                        return '<input type="number" name="click" album_id="' + d.album_id + '" value="' + d.click + '" class="layui-input" style="" />';
                    }
                },
                {
                    field: 'sort_id', width: 100, align: "center", title: '排序', templet: function (d) {
                        return '<input type="number" name="sort_id" album_id="' + d.album_id + '" value="' + d.sort_id + '" class="layui-input" style="" />';
                    }
                },
                { title: '操作', width: 120, toolbar: '#currentTableBar', align: "center", fixed: "right" }
            ]],
            page: false,
            even: true,
            size: 'lg',
            done: function () {
                $(".layui-table-main tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-body tbody tr")[index]).height($(val).height());
                    });
                });
                $(".layui-table-header tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-header thead tr")[index]).height($(val).height());
                    });
                });
            }
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            var result = JSON.stringify(data.field);
            //执行搜索重载
            table.reload('tableContainer', {
                page: {
                    curr: 1
                }
                , where: {
                }
            }, 'data');

            return false;
        });

        /**
         * toolbar监听事件
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'save') {  // 监听保存操作
                var hasEmpty = false;
                var albums = [];
                $("table[class=layui-table]").children("tbody").children("tr").each(function () {
                    if ($(this).find("input[name='title']").val() != undefined) {
                        var album = {};
                        album.album_id = parseInt($(this).find("input[name='title']").attr("album_id"));
                        album.title = $(this).find("input[name='title']").val();
                        album.link_url = $(this).find("input[name='link_url']").val();
                        album.remark = $(this).find("input[name='remark']").val();
                        album.click = parseInt($(this).find("input[name='click']").val());
                        album.sort_id = parseInt($(this).find("input[name='sort_id']").val());
                        if (album.title == "") {
                            hasEmpty = true;
                            return false;
                        }
                        albums.push(album);
                    }
                })
                if (hasEmpty) {
                    layer.msg("标题不能为空", { icon: 2, time: 1000 });
                    return false;
                }
                // console.log(albums);
                $.ajax({
                    type: "POST",
                    url: "/admin/article/AlbumSaveBatch", //提交的地址
                    data: JSON.stringify(albums),
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        if (data.code == CodeSuccess) {
                            layer.msg("保存成功", { icon: 1, time: 1000 }, function () {
                                location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            } else if (obj.event === 'show') {
                var checkStatus = table.checkStatus('tableContainer');
                var data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要显示的数据", { icon: 2, time: 1000 });
                    return false;
                }
                var ids = [];
                for (var i = 0; i < data.length; i++) {
                    ids.push(data[i].album_id);
                }
                changeStatus(ids, 1);
            } else if (obj.event === 'hide') {
                var checkStatus = table.checkStatus('tableContainer');
                var data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要隐藏的数据", { icon: 2, time: 1000 });
                    return false;
                }
                var ids = [];
                for (var i = 0; i < data.length; i++) {
                    ids.push(data[i].album_id);
                }
                changeStatus(ids, 0);
            }
        });

        function changeStatus(ids, status) {
            $.ajax({
                type: "POST",
                url: "/admin/article/AlbumSaveShow", //提交的地址
                data: JSON.stringify({
                    "album_ids": ids,
                    "show": status,
                }),
                async: false,
                beforeSend: function () { //当一个Ajax请求开始时触发
                    this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                },
                error: function (request) {  //失败的话
                },
                success: function (data) {  //成功
                    if (data.code == CodeSuccess) {
                        layer.msg("设置状态成功", { icon: 1, time: 1000 }, function () {
                            location.reload();
                        });
                    } else {
                        layer.msg(data.msg, { icon: 2, time: 1000 });
                    }
                },
                complete: function () {
                    layer.closeAll();
                    layer.close(this.layerIndex);
                },
            });
        }
        //监听表格复选框选择
        table.on('checkbox(currentTableFilter)', function (obj) {
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'delete') {
                layer.confirm('真的删除行么', function (index) {
                    $.ajax({
                        type: "POST",
                        url: "/admin/article/AlbumDestory", //提交的地址
                        data: {
                            "albumId": data.album_id
                        },
                        async: false,
                        beforeSend: function () { //当一个Ajax请求开始时触发
                            this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                        },
                        error: function (request) {  //失败的话
                        },
                        success: function (data) {  //成功
                            if (data.code == CodeSuccess) {
                                layer.msg("删除成功", { icon: 1, time: 1000 }, function () {
                                    location.reload();
                                });
                            } else {
                                layer.msg(data.msg, { icon: 2, time: 1000 });
                            }
                        },
                        complete: function () {
                            layer.close(this.layerIndex);
                        },
                    });
                });
            }
        });
    });
</script>
