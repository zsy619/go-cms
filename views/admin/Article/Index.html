<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">栏目类别</label>
                            <div class="layui-input-inline">
                                <input type="text" name="tree" id="tree" autocomplete="off" class="layui-input">
                                <input type="hidden" name="categoryId" value="0">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">内容标题</label>
                            <div class="layui-input-inline">
                                <input type="text" name="title" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">调用别名</label>
                            <div class="layui-input-inline">
                                <input type="text" name="callIndex" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">审核状态</label>
                            <div class="layui-input-inline">
                                <select name="status">
                                    <option value="-1">状态</option>
                                    <option value="0">草稿</option>
                                    <option value="2">通过</option>
                                    <option value="3">拒绝</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary layui-btn-radius" lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container layui-btn-group">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add"> 添加 </button>
                <button class="layui-btn layui-btn-primary layui-btn-sm data-add-btn" lay-event="audit"> 通过 </button>
                <button class="layui-btn layui-btn-danger layui-btn-sm data-add-btn" lay-event="reject"> 拒绝 </button>
                <button class="layui-btn layui-btn-sm layui-btn-primary data-delete-btn" lay-event="save"> 保存 </button>
            </div>
        </script>
        <table class="layui-hide" id="tableContainer" lay-filter="currentTableFilter"></table>
        <script type="text/html" id="currentTableBar">
            <div class="layui-btn-group">
                <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit">编辑</a>
                <a class="layui-btn layui-btn-primary layui-btn-xs data-count-copy" lay-event="copy">拷贝</a>
                <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete" lay-event="delete">删除</a>
            </div>
        </script>
    </div>
</div>
<script>
    var channelId = parseInt("{{.channelId}}");
    layui.use(['form', 'table', 'treeSelect'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;
        var treeSelect = layui.treeSelect;

        treeSelect.render({
            // 选择器
            elem: '#tree',
            // 异步获取下拉树需要显示的数据
            data: '/admin/article/CategoryTree?channelId=' + channelId,
            // 异步加载方式：get/post，默认get
            type: 'post',
            // 占位符
            placeholder: '栏目类别',
            // 是否开启搜索功能：true/false，默认false
            search: true,
            // 一些可定制的样式
            style: {
                line: {
                    enable: true
                }
            },
            // 点击节点回调
            click: function (d) {
                $("input[name='categoryId']").val(d.current.id);
            },
            // 加载完成后的回调函数
            success: function (d) {
            }
        });

        table.render({
            elem: '#tableContainer',
            url: '/admin/article/ArticlePaginate?status=-1&channelId=' + channelId,
            toolbar: '#toolbarDemo',
            height: "full-170",
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                { type: "checkbox", width: 50 },
                { field: 'article_id', width: 80, title: 'ID', sort: true },
                {
                    field: 'title', title: '内容标题', templet: function (d) {
                        if (d.sub_title != "") {
                            return d.title + "<br/><span style='color:#999'>" + d.sub_title + "</span>";
                        }
                        return d.title;
                    }
                },
                { field: 'call_index', title: '调用链接' },
                {
                    field: 'publish_time', title: '发布时间', width: 170, templet: function (d) {
                        return layui.util.toDateString(d.publish_time, 'yyyy-MM-dd HH:mm:ss');
                    }
                },
                {
                    field: 'img_url', title: '属性', width: 220, templet: function (d) {
                        var outText = d.status == 2 ? "通过" : (d.status == 3 ? "未通过" : "草稿");
                        if (d.is_command == 1) {
                            outText += "/评论";
                        }
                        if (d.is_top == 1) {
                            outText += "/置顶";
                        }
                        if (d.is_red == 1) {
                            outText += "/推荐";
                        }
                        if (d.is_hot == 1) {
                            outText += "/热门";
                        }
                        if (d.is_slide == 1) {
                            outText += "/幻灯片";
                        }
                        return outText;
                    }
                },
                { field: 'remark', title: '备注' },
                {
                    field: 'sort_id', width: 100, align: "center", title: '排序', templet: function (d) {
                        return '<input type="number" name="sort_id" role_id="' + d.role_id + '" value="' + d.sort_id + '" class="layui-input" style="" />';
                    }
                },
                { title: '操作', width: 150, toolbar: '#currentTableBar', align: "center", fixed: "right" }
            ]],
            limits: [10, 15, 20, 25, 50, 100],
            limit: 20,
            page: true,
            // skin: 'line',
            even: true,
            size: 'lg',
            done: function () {
                $(".layui-table-main tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-body tbody tr")[index]).height($(val).height());
                    });
                });
                $(".layui-table-header tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-header thead tr")[index]).height($(val).height());
                    });
                });
            }
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            var result = JSON.stringify(data.field);
            console.log(result);
            //执行搜索重载
            table.reload('tableContainer', {
                page: {
                    curr: 1
                }
                , where: {
                    categoryId: parseInt($("input[name='categoryId']").val()),
                    title: $("input[name='title']").val(),
                    callIndex: $("input[name='callIndex']").val(),
                    status: $("select[name='status']").val(),
                }
            }, 'data');

            return false;
        });

        /**
         * toolbar监听事件
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'add') {  // 监听添加操作
                var index = layer.open({
                    title: '添加内容',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: 'ArticleEdit?channelId=' + channelId,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            } else if (obj.event === 'save') {  // 监听保存操作
                var sorts = [];
                $("input[name='sort_id']").each(function () {
                    var sort = {
                        article_id: parseInt($(this).attr("article_id")),
                        sort_id: parseInt($(this).val())
                    };
                    sorts.push(sort);
                });
                console.log(sorts);
                // return false;
                $.ajax({
                    type: "POST",
                    url: "/admin/article/ArticleSaveSortId", //提交的地址
                    data: JSON.stringify(sorts),
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                $('button[lay-filter="data-search-btn"]').click();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            }
        });

        //监听表格复选框选择
        table.on('checkbox(currentTableFilter)', function (obj) {
            console.log(obj)
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                console.log(data);
                var index = layer.open({
                    title: '编辑内容',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: 'ArticleEdit?articleId=' + data.article_id + '&channelId=' + channelId,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else if (obj.event === 'delete') {
                layer.confirm('真的删除行么', function (index) {
                    $.ajax({
                        type: "POST",
                        url: "/admin/article/ArticleDestory", //提交的地址
                        data: {
                            "roleId": data.role_id
                        },
                        async: false,
                        beforeSend: function () { //当一个Ajax请求开始时触发
                            this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                        },
                        error: function (request) {  //失败的话
                        },
                        success: function (data) {  //成功
                            if (data.code == CodeSuccess) {
                                layer.msg("删除成功", { icon: 1, time: 1000 }, function () {
                                    $('button[lay-filter="data-search-btn"]').click();
                                });
                            } else {
                                layer.msg(data.msg, { icon: 2, time: 1000 });
                            }
                        },
                        complete: function () {
                            layer.closeAll();
                            layer.close(this.layerIndex);
                        },
                    });
                    // obj.del();
                    // layer.close(index);
                });
            }
        });

    });
</script>
