<div class="layuimini-main">
    <form class="layui-form" method="get" lay-filter="frmEdit" id="frmEdit">
        <div class="layui-tab layui-tab-brief layui-tab-card">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
                <li>回复信息</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label required">
                            评论人
                        </label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="hidden" name="comment_id" value="{{.mdl.CommentID}}">
                            <input type="hidden" name="site_id" value="{{.mdl.SiteID}}">
                            <input type="hidden" name="channel_id" value="{{.mdl.ChannelID}}">
                            <input type="hidden" name="parent_id" value="{{.mdl.ParentID}}">
                            <input type="hidden" name="article_id" value="{{.mdl.ArticleID}}">
                            <input type="text" name="user_name" value="{{.mdl.UserName}}" readonly class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">评论IP</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="user_ip" value="{{.mdl.UserIP}}" readonly class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">评论时间</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="add_time" value='{{dateformat .mdl.AddTime "2006-01-02 15:04:05"}}' readonly class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">评论内容</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <textarea name="content" readonly class="layui-textarea">{{.mdl.Content}}</textarea>
                        </div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    {{if .roleMap.IsHasAudit}}
                    <div class="layui-form-item">
                        <label class="layui-form-label">状&nbsp;&nbsp;态</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="status" value="0" title="草稿" {{if eq .mdl.Status 0}}checked="checked" {{end}}>
                            <input type="radio" name="status" value="2" title="通过" {{if eq .mdl.Status 2}}checked="checked" {{end}}>
                            <input type="radio" name="status" value="3" title="拒绝" {{if eq .mdl.Status 3}}checked="checked" {{end}}>
                        </div>
                    </div>
                    {{end}}
                    <div class="layui-form-item">
                        <label class="layui-form-label">锁&nbsp;&nbsp;定</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="is_lock" value="1" title="是" {{if eq .mdl.IsLock true}}checked="checked" {{end}}>
                            <input type="radio" name="is_lock" value="0" title="否" {{if eq .mdl.IsLock false}}checked="checked" {{end}}>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">回&nbsp;&nbsp;复</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="radio" name="is_reply" value="1" title="是" {{if eq .mdl.IsReply true}}checked="checked" {{end}}>
                            <input type="radio" name="is_reply" value="0" title="否" {{if eq .mdl.IsReply false}}checked="checked" {{end}}>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">回复人员</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" name="reply_user" value="{{.mdl.ReplyUser}}" lay-verify="required" lay-reqtext="回复人员为必填项" autocomplete="off" placeholder="" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">时间时间</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <input type="text" id="reply_time" name="reply_time" value='{{dateformat .mdl.ReplyTime "2006-01-02 15:04:05"}}' lay-verify="required" lay-reqtext="回复时间为必填项" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">回复内容</label>
                        <div class="layui-input-inline" style="width: 500px;">
                            <textarea name="reply_content" class="layui-textarea">{{.mdl.ReplyContent}}</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;">
                <button class="layui-btn layui-btn-radius" id="btnSubmit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-radius">重置</button>
            </div>
        </div>
    </form>
</div>
<script>
    layui.use(['form', 'layer', 'wangEditor', 'laydate', 'upload'], function () {
        var form = layui.form;
        var $ = layui.jquery,
            layer = layui.layer,
            wangEditor = layui.wangEditor;
        var laydate = layui.laydate;
        var upload = layui.upload;

        laydate.render({
            elem: '#reply_time', type: 'datetime'
        });

        //自定义验证规则
        form.verify({
            call_index: [/^[a-zA-Z0-9\-\_]{2,50}$/, '请填写正确的调用别名'],
            template: function (value, item) {
                var exp = /(.+?)?.html/;
                if (value && !exp.test(value)) {
                    return '模板路径不正确';
                }
            }
        });

        // 提交事件
        form.on('submit(*)', function (data) {
            return false;
        });

        //方法提交
        $('#btnSubmit').on('click', function () {
            form.submit('frmEdit', function (data) {
                $.ajax({
                    type: "POST", //提交的方法
                    url: "/admin/article/CommentEdit", //提交的地址
                    data: $('#frmEdit').serialize(), // 序列化表单值
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        layer.closeAll();
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.location.reload();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 1000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            });
            return false;
        });
    });
</script>
