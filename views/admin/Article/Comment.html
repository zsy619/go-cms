<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">审核状态</label>
                            <div class="layui-input-inline">
                                <select name="status">
                                    <option value="-1">状态</option>
                                    <option value="0">草稿</option>
                                    <option value="2">通过</option>
                                    <option value="3">拒绝</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">回复状态</label>
                            <div class="layui-input-inline">
                                <select name="reply">
                                    <option value="-1">所有</option>
                                    <option value="1">已回复</option>
                                    <option value="0">未回复</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">锁定状态</label>
                            <div class="layui-input-inline">
                                <select name="lock">
                                    <option value="-1">所有</option>
                                    <option value="0">未锁定</option>
                                    <option value="1">已锁定</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button id="btnSearch" type="submit" class="layui-btn layui-btn-primary layui-btn-radius" lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <table class="layui-hide" id="tableContainer" lay-filter="currentTableFilter"></table>
    </div>
</div>
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container layui-btn-group">
        <button class="layui-btn layui-btn-primary layui-btn-sm data-add-btn" lay-event="audit"><i class="layui-icon layui-icon-ok"></i>通过</button>
        <button class="layui-btn layui-btn-danger layui-btn-sm data-add-btn" lay-event="reject"><i class="layui-icon layui-icon-close"></i>拒绝</button>
    </div>
</script>
<script>
    var channelId = parseInt("{{.channelId}}");
    layui.use(['form', 'table', 'treeSelect'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;
        var treeSelect = layui.treeSelect;
        table.render({
            elem: '#tableContainer',
            url: '/admin/article/CommentPaginate',
            where: {
                status: parseInt($("select[name='status']").val()),
                lock: parseInt($("select[name='lock']").val()),
                reply: parseInt($("select[name='reply']").val()),
                channelId: channelId,
            },
            toolbar: '#toolbarDemo',
            height: "full-180",
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                { type: "checkbox", width: 50 },
                {
                    field: 'comment_id', width: 110, title: 'ID'
                },
                {
                    field: 'title', title: '内容标题'
                },
                { field: 'user_name', title: '评论人', width: 120 },
                { field: 'user_ip', title: '评论IP', width: 120 },
                { field: 'content', title: '评论内容' },
                {
                    field: 'add_time', title: '评论时间', width: 170, templet: function (d) {
                        return layui.util.toDateString(d.publish_time, 'yyyy-MM-dd HH:mm:ss');
                    }
                },
                {
                    field: 'status', title: '状态', width: 150, align: "center", templet: function (d) {
                        var outText = d.status == 2 ? '<span class="layui-badge layui-bg-green">通过</span>' : (d.status == 3 ? '<span class="layui-badge">拒绝</span>' : '<span class="layui-badge layui-bg-gray">草稿</span>');
                        if (d.is_lock == 1) {
                            outText += '<span class="layui-badge layui-bg-cyan">锁定</span>';
                        }
                        if (d.is_reply == 1) {
                            outText += '<span class="layui-badge layui-bg-blue">回复</span>';
                        }
                        return outText;
                    }
                },
                { title: '操作', width: 150, align: "center", fixed: "right", templet: function (d){
                        var htmlValue = "<div class=\"layui-btn-group\">\n";
                        if ("{{.roleMap}}" != null && "{{.roleMap.IsSuccess}}" === "true") {
                            if ("{{.roleMap.IsHasEdit}}" === "true") {
                                htmlValue += "<a class=\"layui-btn layui-btn-normal layui-btn-xs data-count-edit layui-btn-radius\" lay-event=\"edit\"><i class=\"layui-icon layui-icon-edit\"></i>编辑</a>\n";
                            }
                            if ("{{.roleMap.IsHasDelete}}" === "true") {
                                htmlValue += "<a class=\"layui-btn layui-btn-xs layui-btn-danger data-count-delete layui-btn-radius\" lay-event=\"delete\"><i class=\"layui-icon layui-icon-close\"></i>删除</a>\n";
                            }
                        }
                        htmlValue += "</div>";
                        return htmlValue;
                    } }
            ]],
            limits: [10, 15, 20, 25, 50, 100],
            limit: 20,
            page: true,
            // skin: 'line',
            even: true,
            size: 'lg',
            done: function () {
                $(".layui-table-main tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-body tbody tr")[index]).height($(val).height());
                    });
                });
                $(".layui-table-header tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-header thead tr")[index]).height($(val).height());
                    });
                });
            },
            before: function (){
                if ("{{.roleMap}}" != null && "{{.roleMap.IsSuccess}}" === "true"){
                    if ("{{.roleMap.IsHasAudit}}" === "false"){
                        $("button[lay-event='audit']").remove();
                        $("button[lay-event='reject']").remove();
                    }
                }
            }
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            var result = JSON.stringify(data.field);
            //执行搜索重载
            table.reload('tableContainer', {
                page: {
                    curr: 1
                }
                , where: {
                    status: parseInt($("select[name='status']").val()),
                    lock: parseInt($("select[name='lock']").val()),
                    reply: parseInt($("select[name='reply']").val()),
                    channelId: channelId,
                }
            }, 'data');

            return false;
        });

        /**
         * toolbar监听事件
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'audit') {
                var checkStatus = table.checkStatus('tableContainer');
                var data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要审核的数据", { icon: 2, time: 1000 });
                    return false;
                }
                var ids = [];
                for (var i = 0; i < data.length; i++) {
                    ids.push(data[i].comment_id);
                }
                changeStatus(ids, 2);
            } else if (obj.event === 'reject') {
                var checkStatus = table.checkStatus('tableContainer');
                var data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要审核的数据", { icon: 2, time: 1000 });
                    return false;
                }
                var ids = [];
                for (var i = 0; i < data.length; i++) {
                    ids.push(data[i].comment_id);
                }
                changeStatus(ids, 3);
            }
        });

        function changeStatus(ids, status) {
            $.ajax({
                type: "POST",
                url: "/admin/article/CommentChangeStatus", //提交的地址
                data: JSON.stringify({
                    "comment_ids": ids,
                    "status": status,
                }),
                async: false,
                beforeSend: function () { //当一个Ajax请求开始时触发
                    this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                },
                error: function (request) {  //失败的话
                },
                success: function (data) {  //成功
                    if (data.code == CodeSuccess) {
                        layer.msg("审核成功", { icon: 1, time: 1000 }, function () {
                            $('button[lay-filter="data-search-btn"]').click();
                        });
                    } else {
                        layer.msg(data.msg, { icon: 2, time: 1000 });
                    }
                },
                complete: function () {
                    layer.closeAll();
                    layer.close(this.layerIndex);
                },
            });
        }

        //监听表格复选框选择
        table.on('checkbox(currentTableFilter)', function (obj) {
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                var index = layer.open({
                    title: '编辑',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: 'CommentEdit?commentId=' + data.comment_id + '&channelId=' + channelId,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else if (obj.event === 'delete') {
                layer.confirm('真的删除行么', function (index) {
                    $.ajax({
                        type: "POST",
                        url: "/admin/article/CommentDestory", //提交的地址
                        data: {
                            "commentId": data.comment_id
                        },
                        async: false,
                        beforeSend: function () { //当一个Ajax请求开始时触发
                            this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                        },
                        error: function (request) {  //失败的话
                        },
                        success: function (data) {  //成功
                            if (data.code == CodeSuccess) {
                                layer.msg("删除成功", { icon: 1, time: 1000 }, function () {
                                    $('button[lay-filter="data-search-btn"]').click();
                                });
                            } else {
                                layer.msg(data.msg, { icon: 2, time: 1000 });
                            }
                        },
                        complete: function () {
                            layer.closeAll();
                            layer.close(this.layerIndex);
                        },
                    });
                });
            }
        });

    });
</script>
