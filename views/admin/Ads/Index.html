<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">站点列表</label>
                            <div class="layui-input-inline">
                                <select id="siteId" name="siteId" lay-filter="siteId">
                                    <option value="0">请选择</option>
                                    {{range $index,$item := .siteList}}
                                    <option value="{{$item.SiteID}}">{{$item.Title}}</option>
                                    {{end}}
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">广告类别</label>
                            <div class="layui-input-inline">
                                <select name="category_id">
                                    <option value="0">请选择</option>
                                    {{range $index,$item := .categoryList}}
                                    <option value="{{$item.CategoryID}}">{{$item.Title}}</option>
                                    {{end}}
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">广告标题</label>
                            <div class="layui-input-inline">
                                <input type="text" name="title" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">调用别名</label>
                            <div class="layui-input-inline">
                                <input type="text" name="callIndex" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">审核状态</label>
                            <div class="layui-input-inline">
                                <select name="status">
                                    <option value="-1">状态</option>
                                    <option value="0">草稿</option>
                                    <option value="2">通过</option>
                                    <option value="3">拒绝</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary layui-btn-radius" lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <table class="layui-hide" id="tableContainer" lay-filter="currentTableFilter"></table>
    </div>
</div>
{{template "admin/Public/Button_AddAuditSave.html" }}
<script>
    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        table.render({
            elem: '#tableContainer',
            url: '/admin/ads/adspaginate',
            where: { status: -1 },
            toolbar: '#toolbarDemo',
            height: "full-200",
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                { type: "checkbox", width: 50 },
                { field: 'ads_id', width: 80, title: 'ID', sort: true },
                {
                    field: 'title', title: '广告标题', templet: function (d) {
                        var label = '';
                        switch (d.status) {
                            case 2:
                                label = '<span class="layui-badge-dot layui-bg-green"></span>';
                                break;
                            case 3:
                                label = '<span class="layui-badge-dot"></span>';
                                break;
                            default:
                                label = '<span class="layui-badge-dot layui-bg-black"></span>';
                                break;
                        }
                        return label + "&nbsp;" + d.title;
                    }
                },
                { field: 'call_index', minWidth: 150, title: '调用别名', sort: true },
                { field: 'link_url', title: '广告链接', minWidth: 150 },
                { field: 'target', title: 'Target', width: 100 },
                {
                    field: 'img_url1', title: '广告图片', width: 150, templet: function (d) {
                        if (d.img_url1 != "") {
                            return '<img src="' + d.img_url1 + '" style="max-width: 100px;max-height: 100px;" />';
                        }
                        return "";
                    }
                },
                {
                    field: 'begin_time', title: '起止时间', width: 150, templet: function (d) {
                        return layui.util.toDateString(d.begin_time, 'yyyy-MM-dd HH:mm:ss') + '<br>' + layui.util.toDateString(d.end_time, 'yyyy-MM-dd HH:mm:ss');
                    }
                },
                {
                    field: 'status', title: '属性', width: 220, templet: function (d) {
                        var outText = d.status == 2 ? '<span class="layui-badge layui-bg-green">通过</span>' : (d.status == 3 ? '<span class="layui-badge">拒绝</span>' : '<span class="layui-badge layui-bg-gray">草稿</span>');
                        if (d.is_top == 1) {
                            outText += '<span class="layui-badge layui-bg-blue">置顶</span>';
                        }
                        if (d.is_red == 1) {
                            outText += '<span class="layui-badge layui-bg-black">推荐</span>';
                        }
                        if (d.is_hot == 1) {
                            outText += '<span class="layui-badge layui-bg-green">热门</span>';
                        }
                        if (d.is_slide == 1) {
                            outText += '<span class="layui-badge layui-bg-orange">幻灯片</span>';
                        }
                        return outText;
                    }
                },
                {
                    field: 'sort_id', width: 100, align: "center", title: '排序', templet: function (d) {
                        return '<input type="number" name="sort_id" ads_id="' + d.ads_id + '" value="' + d.sort_id + '" class="layui-input" style="" />';
                    }
                },
                { title: '操作', width: 210, align: "center", fixed: "right", templet: function (d){
                        var htmlValue = "<div class=\"layui-btn-group\">\n";
                        if ("{{.roleMap}}" != null && "{{.roleMap.IsSuccess}}" === "true") {
                            if ("{{.roleMap.IsHasEdit}}" === "true") {
                                htmlValue += "<a class=\"layui-btn layui-btn-normal layui-btn-xs data-count-edit layui-btn-radius\" lay-event=\"edit\"><i class=\"layui-icon layui-icon-edit\"></i>编辑</a>\n";
                            }
                            if ("{{.roleMap.IsHasAdd}}" === "true") {
                                htmlValue += "<a class=\"layui-btn layui-btn-primary layui-btn-xs data-count-clone\" lay-event=\"clone\"><i class=\"layui-icon layui-icon-form\"></i>拷贝</a>\n";
                            }
                            if ("{{.roleMap.IsHasDelete}}" === "true") {
                                htmlValue += "<a class=\"layui-btn layui-btn-xs layui-btn-danger data-count-delete layui-btn-radius\" lay-event=\"delete\"><i class=\"layui-icon layui-icon-close\"></i>删除</a>\n";
                            }
                        }
                        htmlValue += "</div>";
                        return htmlValue;
                    } }
            ]],
            limits: [10, 15, 20, 25, 50, 100],
            limit: 20,
            page: true,
            // skin: 'line',
            even: true,
            size: 'lg',
            done: function () {
                $(".layui-table-main tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-body tbody tr")[index]).height($(val).height());
                    });
                });
                $(".layui-table-header tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-header thead tr")[index]).height($(val).height());
                    });
                });

                /*// 检查页面权限
                rolePower("{{.roleId}}", "ads_index", function (roleMap){
                    if (roleMap != null && roleMap.isSuccess === true){
                        if (!roleMap.isHasAdd){
                            $("button[lay-event='add']").remove();
                            $("a[lay-event='clone']").remove();
                        }
                        if (!roleMap.isHasAudit){
                            $("button[lay-event='audit']").remove();
                            $("button[lay-event='reject']").remove();
                        }
                        if (!roleMap.isHasEdit){
                            $("button[lay-event='save']").remove();
                            $("a[lay-event='edit']").remove();
                        }
                        if (!roleMap.isHasDelete){
                            $("a[lay-event='delete']").remove();
                        }
                    }
                });*/
            },
            before: function (){
                if ("{{.roleMap}}" != null && "{{.roleMap.IsSuccess}}" === "true"){
                    if ("{{.roleMap.IsHasAdd}}" === "false"){
                        $("button[lay-event='add']").remove();
                    }
                    if ("{{.roleMap.IsHasAudit}}" === "false"){
                        $("button[lay-event='audit']").remove();
                        $("button[lay-event='reject']").remove();
                    }
                    if ("{{.roleMap.IsHasEdit}}" === "false"){
                        $("button[lay-event='save']").remove();
                    }
                }
            }
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            var result = JSON.stringify(data.field);
            //执行搜索重载
            table.reload('tableContainer', {
                page: {
                    curr: 1
                }
                , where: {
                    siteId: parseInt($("select[name='siteId']").val()),
                    categoryId: parseInt($("select[name='category_id']").val()),
                    status: parseInt($("select[name='status']").val()),
                    title: $("input[name='title']").val(),
                    callIndex: $("input[name='callIndex']").val(),
                }
            }, 'data');

            return false;
        });

        /**
         * toolbar监听事件
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'add') {  // 监听添加操作
                var index = layer.open({
                    title: '添加',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: 'AdsEdit',
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            } else if (obj.event === 'save') {  // 监听保存操作
                var sorts = [];
                $("input[name='sort_id']").each(function () {
                    var sort = {
                        ads_id: parseInt($(this).attr("ads_id")),
                        sort_id: parseInt($(this).val())
                    };
                    sorts.push(sort);
                });
                $.ajax({
                    type: "POST",
                    url: "/admin/ads/AdsSaveSortId", //提交的地址
                    data: JSON.stringify(sorts),
                    async: false,
                    beforeSend: function () { //当一个Ajax请求开始时触发
                        this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                    },
                    error: function (request) {  //失败的话
                    },
                    success: function (data) {  //成功
                        if (data.code == CodeSuccess) {
                            layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                $('button[lay-filter="data-search-btn"]').click();
                            });
                        } else {
                            layer.msg(data.msg, { icon: 2, time: 5000 });
                        }
                    },
                    complete: function () {
                        layer.close(this.layerIndex);
                    },
                });
            } else if (obj.event === 'audit') {
                var checkStatus = table.checkStatus('tableContainer');
                var data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要审核的数据", { icon: 2, time: 1000 });
                    return false;
                }
                var ids = [];
                for (var i = 0; i < data.length; i++) {
                    ids.push(data[i].ads_id);
                }
                changeStatus(ids, 2);
            } else if (obj.event === 'reject') {
                var checkStatus = table.checkStatus('tableContainer');
                var data = checkStatus.data;
                if (data.length == 0) {
                    layer.msg("请选择要审核的数据", { icon: 2, time: 1000 });
                    return false;
                }
                var ids = [];
                for (var i = 0; i < data.length; i++) {
                    ids.push(data[i].ads_id);
                }
                changeStatus(ids, 3);
            }
        });

        function changeStatus(ids, status) {
            $.ajax({
                type: "POST",
                url: "/admin/ads/AdsChangeStatus", //提交的地址
                data: JSON.stringify({
                    "ads_ids": ids,
                    "status": status,
                }),
                async: false,
                beforeSend: function () { //当一个Ajax请求开始时触发
                    this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                },
                error: function (request) {  //失败的话
                },
                success: function (data) {  //成功
                    if (data.code == CodeSuccess) {
                        layer.msg("审核成功", { icon: 1, time: 1000 }, function () {
                            $('button[lay-filter="data-search-btn"]').click();
                        });
                    } else {
                        layer.msg(data.msg, { icon: 2, time: 1000 });
                    }
                },
                complete: function () {
                    layer.closeAll();
                    layer.close(this.layerIndex);
                },
            });
        }

        //监听表格复选框选择
        table.on('checkbox(currentTableFilter)', function (obj) {
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            var data = obj.data;
            if (obj.event === 'clone') {
                var index = layer.open({
                    title: '克隆广告',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: 'AdsEdit?clone=1&adsId=' + data.ads_id,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else if (obj.event === 'edit') {
                var index = layer.open({
                    title: '编辑广告',
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['100%', '100%'],
                    content: 'AdsEdit?adsId=' + data.ads_id,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else if (obj.event === 'delete') {
                layer.confirm('真的删除行么', function (index) {
                    $.ajax({
                        type: "POST",
                        url: "/admin/ads/AdsDestory", //提交的地址
                        data: {
                            "adsId": data.ads_id
                        },
                        async: false,
                        beforeSend: function () { //当一个Ajax请求开始时触发
                            this.layerIndex = layer.load(0, { shade: [0.5, '#393D49'] });
                        },
                        error: function (request) {  //失败的话
                        },
                        success: function (data) {  //成功
                            if (data.code == CodeSuccess) {
                                layer.msg("提交成功", { icon: 1, time: 1000 }, function () {
                                    $('button[lay-filter="data-search-btn"]').click();
                                });
                            } else {
                                layer.msg(data.msg, { icon: 2, time: 1000 });
                            }
                        },
                        complete: function () {
                            layer.closeAll();
                            layer.close(this.layerIndex);
                        },
                    });
                });
            }
        });

    });
</script>
