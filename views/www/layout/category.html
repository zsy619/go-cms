<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{{.category.SeoTitle}} - {{.site.Title}}</title>
    <link href="/static/favicon.ico" rel="icon">
    <meta name="Keywords" content="{{.category.SeoKeyword}}" />
    <meta name="description" content="{{.category.SeoKeyword}}" />
    <script src="{{.webroot}}js/common/common.js?r={{.time}}"></script>
    <link href="/static/plugins/loading/app.min.css?r={{.time}}" rel="stylesheet" />
    <script src="/static/plugins/loading/app.min.js?r={{.time}}"></script>
    <script src="/static/plugins/moment/moment.min.js?r={{.time}}"></script>
    <script src="/static/plugins/layui/layui.js?r={{.time}}"></script>
    <script src="/static/const.js?r={{.time}}"></script>
    <script>
        var webroot = "{{.webroot}}";
        var controllerName = "{{.controllerName}}";
        var actionName = "{{.actionName}}";
        var debug = "{{.debug}}";
    </script>
</head>

<body>
    {{template "www/layout/header.html" .}}
    <div class="other-banner">
        <img src="{{.webroot}}images/other_banner.png" id="banner_xxgk" style="display: none;" class="img" />
        <img src="{{.webroot}}images/other_banner3.png" id="banner_jgsz" style="display: none;" class="img" />
        <img src="{{.webroot}}images/other_banner4.png" id="banner_xyzx" style="display: none;" class="img" />
        <img src="{{.webroot}}images/other_banner5.png" id="banner_jyjx" style="display: none;" class="img" />
        <img src="{{.webroot}}images/other_banner6.png" id="banner_zsjy" style="display: none;" class="img" />
        <img src="{{.webroot}}images/other_banner2.png" id="banner_lxwm" style="display: none;" class="img" />
    </div>
    <div class="main">
        <div class="w1200 clearfix">
            <div class="nav-aside">
                <div class="top" id="channelName">&nbsp;</div>
                <ul id="urlNav">
                </ul>
            </div>
            {{.LayoutContent}}
        </div>
        {{template "www/layout/footer.html" .}}
        <script type="text/javascript">
            $(function () {
                $("#banner_" + controllerName).show();
                $.ajax({
                    url: "/api/category/find?channel_name=" + controllerName + "&r=" + Math.random(),
                    dataType: "json",
                    type: "get",
                    beforeSend: function () {
                        $("#channelName").html("");
                        $("#urlNav").html("");
                        $(".nav-aside").busyLoad("show", { spinner: "circle-line" });
                    },
                    success: function (res) {
                        // console.log(res);
                        if (res.code == 0) {
                            var len = res.data.length;
                            for (var i = 0; i < len; i++) {
                                var item = res.data[i];
                                if (i == 0) {
                                    $("#channelName").html(item.channel_title);
                                }
                                var url = item.link_url;
                                var title = item.title;
                                var liItem = item.call_index == actionName ? ('<li class="active"><a href="' + url + '">' + title + '</a></li>') : ('<li><a href="' + url + '">' + title + '</a></li>');
                                $("#urlNav").append(liItem);
                            }
                        }
                    },
                    error: function () {
                        alert('failed!');
                    },
                    complete: function () {
                        $(".nav-aside").busyLoad("hide", { animate: "fade" });
                    }
                });
            })
            layui.use(['form', 'element', 'laypage', 'layer'], function () {
                var form = layui.form,
                    element = layui.element
                laypage = layui.laypage,
                    layer = layui.layer;

                form.render(); //刷新所有渲染效果，也可以单独熟悉某个效果	
                form.render('select'); //刷新select选择框渲染
            })

        </script>
</body>

</html>
